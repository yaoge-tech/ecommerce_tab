<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migoo · Commerce Tab</title>
<style>
  :root {
    --brand:      #007AFF;
    --brand-soft: #F5FAFF;
    --black:      #081021;
    --text-87:    rgba(0,0,0,0.87);
    --text-65:    rgba(0,0,0,0.65);
    --text-40:    rgba(0,0,0,0.40);
    --grey-99:    #999999;
    --chip-bg:    #F3F4F6;
    /* 被引用的商品块专用底色 —— 比 chip-bg 再浅一档。
       它在卡里只是"这件东西"的一个记号,不该和卡本身争分量。 */
    --ref-bg:     #F9FAFB;
    /* Migoo 说话的底色。全站一条规则:白=货 · 灰=Migoo 在说话 · 蓝=你说的话。
       会话 AI 气泡与流内插卡共用它 —— 插卡就是"Migoo 在流里插了句话",
       点进去是同一段对话,底色一致这件事不需要任何文案解释。 */
    --migoo-say:  #F2F3F7;
    --line-09:    rgba(0,0,0,0.09);
    --line-06:    rgba(0,0,0,0.06);
    --ink:        #33507A;
    --lk-scarce:  #C77400;
    --lk-good:    #1E9E54;
    --grey-bd:    #BDBDBD;
    --section-gap:#F9FAFB;
    --serif: "New York", Georgia, "Times New Roman", serif;
    --sf: -apple-system, "SF Pro Text", "SF Pro Display", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { font-family: var(--sf); background: #E9EBEF; color: var(--text-87); padding: 32px 24px 80px; }

  .page-head { text-align: center; margin-bottom: 26px; }
  .page-head h1 { font-size: 21px; font-weight: 600; color: var(--black); letter-spacing: -0.4px; }
  .page-head p  { font-size: 13px; color: #6B7280; margin-top: 5px; }
  .page-head a  { color: var(--brand); text-decoration: none; }

  .stage { display: flex; justify-content: center; align-items: flex-start; }

  .phone {
    width: 393px; height: 852px; flex-shrink: 0;
    background: #fff; border-radius: 44px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.04);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .statusbar { height: 54px; flex-shrink: 0; background: #fff; position: relative; z-index: 60;
    display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 10px; }
  .statusbar .time { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .statusbar .icons { display: flex; align-items: center; gap: 7px; }

  .screen-body { flex: 1; overflow-y: auto; overflow-x: hidden; background: #fff; padding-bottom: 28px; }
  .screen-body::-webkit-scrollbar { width: 0; }

  /* ---------- greeting + ask ---------- */
  /* 问候语用 "we" 而非 "you":you shopping 是把人当买家,
     we looking 把 Migoo 放进这件事里 —— 一个纯购物网站说不出这个 we。 */
  .greet { font-family: var(--serif); font-size: 32px; line-height: 1.16; font-weight: 600;
    letter-spacing: -0.4px; color: var(--black); text-align: center; padding: 14px 36px 0; }
  /* 入口跟着输入框走:输入框在视野里就贴在它左侧,滚走了才浮起来。

     曾经把它收进输入框「里」,那是错的 —— 输入框里的东西,惯例上一律读作
     标签或状态(搜索放大镜、货币符号、@ 前缀),没有一个是可点的。
     结果是:碰那块区域的动作意图是"我要打字",却弹出一个会话 ——
     不是"发现不了",是一个熟悉手势给出了意外结果,更伤。
     让它最擅长说"这个框属于谁"的位置,恰好是最不像"点我"的位置,不能兼得。

     所以放回框外,但不是之前那版 52px 实心黑圆(全屏最重、黑在色系里没出处)。
     40px 品牌蓝:在框外实心圆就是按钮,读法没有歧义;体量退到headline之下;
     蓝是首屏唯一的品牌色块,自然读成"这一屏唯一可交互的强调"。 */
  .askrow { display: flex; align-items: center; gap: 10px; margin: 22px 16px 6px; }
  .askrow .ask { flex: 1; min-width: 0; margin: 0; }
  /* 两枚 agent 头像统一成白底圆:图形缩在圆里,不做满幅裁切。
     mshop 的标是"Migoo 的脸 + 右下角购物袋",满幅圆裁会削掉袋子那一角,
     而袋子是它唯一说"电商"的部件。缩进来就都保得住,两个 agent 也同形同大小。
     图片已抠掉原有的浅灰底并裁到内容外接框,否则白圆里会浮出一个方块。 */
  .askbot { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; position: relative;
    background: #fff; box-shadow: 0 2px 9px rgba(8,16,33,.14); }
  /* 两个 agent 的标都缩到 76% 站在白圆里 —— 同形、同大小、同留白。
     它们在界面上是并列的两个 agent,不该一个满幅一个缩进去。 */
  .askbot img { width: 76%; height: 76%; object-fit: contain; }
  /* dock 版里点头像和点输入框走的是同一件事,两个并排的可点区域说的是同一句话。
     并进来 —— 它不再是"另一个入口",而是这个输入框归谁管的标记。
     不挂 onclick:点击冒泡给 .ask,一个动作只留一处定义。 */
  /* 头像进框之后,框底不能还是 #F3F4F6 —— 白圆压在上面对比太硬,
     两个本该是一体的东西看起来像贴上去的。压浅到 #F7F8FA:
     仍然不是纯白(输入框得看得出是个可写的槽),但白圆坐进去是坐着,不是浮着。 */
  .ask.withbot { padding-left: 7px; gap: 10px; background: #F7F8FA; }
  .askbot.inbox { width: 38px; height: 38px; box-shadow: none; cursor: text; }
  /* 这里曾挂过一个"可续聊"的绿点,删了。三个毛病:
       · 判断条件是"线程里有内容",第一次用完就永远为真 —— 永远亮着等于没提示
       · 点这个形状在所有 App 里都读作"有未读",而它只是"有历史",语义借错了
       · 绿在本文件已经是"价格划算"(--lk-good),同色第三种含义
     以后若 mshop 会主动往线程里说话,再用右上角 ♡ 那套(蓝底 + 数字),
     一个"有 N 件新东西"的约定,不要两套。 */
  .ask { margin: 22px 16px 6px; height: 52px; border-radius: 26px; background: var(--chip-bg);
    display: flex; align-items: center; padding: 0 16px 0 20px; cursor: text; gap: 14px; }
  /* placeholder 轮播:一条只能说一件事,轮播才说得清"你可以怎么说"。
     内容是表达方式的示例(自然语言/带约束/指代/判断),与下方 chips(可点的快捷 query)分工不同 */
  .ask .ph { flex: 1; font-size: 16px; color: var(--text-40); letter-spacing: -0.2px;
    height: 21px; overflow: hidden; position: relative; min-width: 0; }
  .ask .phroll { position: absolute; left: 0; right: 0; top: 0;
    transition: transform .46s cubic-bezier(.32,.72,0,1); }
  .ask .phroll span { display: block; height: 21px; line-height: 21px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ask .aic { display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
  /* Ask 下的 query 推荐 chips:能力外露 + 个性化 query */
  .askchips { display: flex; gap: 7px; overflow-x: auto; padding: 10px 16px 0; }
  /* 问候语之下给一大段,确立它是统领;块内(chips → 输入框 → 内容)一路收紧 */
  .askchips.above { padding: 32px 16px 0; }
  .askchips.above + .askrow { margin-top: 11px; }
  .askchips::-webkit-scrollbar { height: 0; }
  /* 收尾块 + 右缘渐隐,只在这一排真的放不下时才加(见 markScrollable):
     · 收尾块 —— 横向滚动容器的右 padding 不作数,滑到底最后一枚会贴死在边上
     · 渐隐   —— 把硬切说成"右边还有",否则看起来像渲染坏了
     无条件加是错的:尾块自己就占 16px+7px 间距,足以把一排本来放得下的
     chips 顶出 23px 溢出,于是最后一枚被自己造出来的渐隐淡掉半截。 */
  .askchips.scrollable::after { content: ''; flex: 0 0 16px; }
  .askchips.scrollable { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 26px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 26px), transparent); }
  /* 圆角按内容分,不按位置分:
       全圆 pill = 一句现成的话(它就是一句话的形状,和会话气泡同族)
       方一点   = 一个能力入口(点开还有下一层,更像按钮)
     所以整句 query 的 chips 保持 999px,只有能力 chips 收成 10px。 */
  .achip { flex: 0 0 auto; font-size: 12.5px; color: var(--text-65); background: #fff;
    border: 1px solid var(--line-09); border-radius: 999px; padding: 7px 12px;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  /* 类名不能叫 .cap —— 本文件里 .cap 已经是商品卡的文字区(padding:8px 2px 0),
     而它声明在 .achip 之后、特异度相同,会把 chip 的内边距整个盖掉,
     把 chip 压成 25px 高的扁块。同名不同物是这种 bug 的唯一来源。 */
  .achip.capchip { border-radius: 10px; }
  /* 能力 chip 的 icon:比文字浅一档,是区分记号不是装饰重点 */
  .achip .ci { display: flex; color: var(--text-40); }

  /* ---------- sections ---------- */
  .sec { margin-top: 26px; }
  /* 这个标题一度被我拿掉,是错的,把弯路记下来:
     这一页是两段,不是"一个区加一片内容" ——
       上半主动:告诉我你要什么,我来接(问候语 + chips + 输入框)
       下半被动:你没说的时候,我给的
     两种模式、两个命题,第二段必须有名字。拿掉之后底色、细线、渐变都试过,
     全是在替一个本该由标题承担的职责找替身,一个比一个别扭。
     该修的只是措辞:"Daily" 是假承诺(这片内容刷一次就换,不是每天一编),
     换成第一人称、不许频率的说法即可。 */
  .sec-head { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; cursor: pointer; }
  .sec-head .t { font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: -0.2px; color: var(--black); }
  .sec-head .s { font-size: 13px; color: var(--text-65); margin-top: 3px; }
  .sec-head .chev { flex-shrink: 0; }

  .hrow { display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px 2px; }
  .hrow::-webkit-scrollbar { height: 0; }
  .hcard { flex: 0 0 150px; width: 150px; min-width: 0; overflow: hidden; cursor: pointer; }
  .hcard .imgw, .gcard .imgw { position: relative; border-radius: 14px; overflow: hidden; background: #F3F4F6; }
  .hcard .imgw img { width: 100%; aspect-ratio: 1/1.18; object-fit: cover; display: block; }

  .grid { display: flex; gap: 10px; padding: 12px 16px 0; }
  .gcol { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .gcard { cursor: pointer; }
  .gcard .imgw img { width: 100%; aspect-ratio: 1/1.22; object-fit: cover; display: block; }

  .cap { padding: 8px 2px 0; }
  .cap .ttl { font-size: 13px; line-height: 1.35; color: var(--text-87); letter-spacing: -0.1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cap .pr { font-size: 14.5px; font-weight: 700; color: var(--black); margin-top: 4px; }
  .why { margin-top: 4px; font-size: 11.5px; line-height: 1.35; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .why.ev { -webkit-line-clamp: 1; font-weight: 600; }
  /* 身份标识移到图上角标(见 .ltag)—— 图先被看到,不必等读到文字才知道这是自己收藏的。
     故事件行不再带 ♥,专职说"变了什么 + 对你意味着什么",与身份分工。 */
  .scard .why.ev { -webkit-line-clamp: 2; }
  /* 左上角:与左下角 ✦ 分居两角互不遮挡;白底毛玻璃在深浅商品图上都能读 */
  .imgw .ltag { position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 3.5px;
    background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-radius: 7px; padding: 4px 7px 4px 6px; box-shadow: 0 1px 3px rgba(8,16,33,.10);
    font-size: 9.5px; font-weight: 700; letter-spacing: .1px; color: var(--black); }
  .imgw .ltag svg { flex-shrink: 0; color: var(--brand); }
  /* Buy now:与"整卡可点=看详情"是两个不同动作,所以按钮成立(插卡去掉 CTA 是因为动作相同)。
     用浅蓝底而非实心 —— 三张 scard 散在 19 坑里,实测同屏碰不到两张,不会连成按钮矩阵。 */
  .buynow { display: block; width: 100%; margin-top: 9px; height: 32px; border: none; border-radius: 9px;
    background: rgba(0,122,255,.10); color: var(--brand); font-family: var(--sf);
    font-size: 12.5px; font-weight: 700; letter-spacing: -.1px; cursor: pointer; }
  .buynow:active { background: rgba(0,122,255,.18); }
  .pdp-why { margin: 10px 16px 0; font-size: 12.5px; line-height: 1.4; color: var(--ink);
    background: rgba(51,80,122,0.06); border-radius: 8px; padding: 6px 10px;
    display: flex; align-items: center; gap: 6px; }

  .heart { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.92); box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sparkb { position: absolute; left: 8px; bottom: 8px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.94); box-shadow: 0 1px 5px rgba(0,0,0,0.12);
    display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* ---------- 流内 query 卡(唯一一种)---------- */
  /* 一个框架吃下四种旧卡型:引号 + query + 可选 attachment。
     引号一眼说明"这是一句问话";绝对定位以避开内容流。
     不用异色底 —— 底色已被 --migoo-say 占为语义,颜色不能再兼做强调。 */
  .qcard { background: var(--migoo-say); border-radius: 14px; position: relative;
    padding: 14px 14px 16px; cursor: pointer; }
  .qcard::before { content: "\201C"; position: absolute; left: 11px; top: 2px;
    font-family: var(--serif); font-size: 42px; line-height: 1; color: rgba(8,16,33,.10); }
  /* 字号仍是两档,但判据从"哪种卡"变成"有没有 attachment":
       .bare 19/600 —— 无 attachment,字要独自撑住整张卡
       默认 17/500 —— attachment 分担视觉重量 */
  .qcard .q { font-family: var(--serif); font-size: 17px; line-height: 1.26; font-weight: 500;
    color: var(--black); margin-top: 21px; }
  .qcard.bare .q { font-size: 19px; line-height: 1.22; font-weight: 600; margin-top: 22px; }

  /* attachment 三形态,共用外框间距 */
  .qatt { margin-top: 13px; }
  /* ① 两件对撞:半宽方图 + 短名 + PK 徽章 */
  .qatt.pk { display: flex; gap: 8px; position: relative; align-items: flex-start; }
  .qatt.pk .cside { width: calc(50% - 4px); }
  .qatt.pk .cside img { width: 100%; aspect-ratio: 1/1; object-fit: cover;
    border-radius: 9px; background: #F3F4F6; display: block; }
  /* 不放价格 —— 价格是决策信息,属于会话和 PDP;卡只负责把问题摆出来 */
  .qatt.pk .cside .cn { font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--black);
    margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 37% ≈ 图片垂直中心(图 1:1,其下还有商品名一行) */
  .qatt.pk .vs { position: absolute; left: 50%; top: 37%; transform: translate(-50%,-50%);
    background: #fff; color: var(--black); font-size: 9.5px; font-weight: 800; letter-spacing: .3px;
    border-radius: 999px; padding: 4px 7px; box-shadow: 0 1px 5px rgba(0,0,0,.16); }
  /* ② 商品 attachment:等分方图,不带名字 —— 是"这几件"的概括,不需要逐个点名 */
  .qatt.row { display: flex; gap: 5px; }
  .qatt.row img { width: calc(33.33% - 3.4px); aspect-ratio: 1/1; object-fit: cover;
    border-radius: 8px; background: #fff; display: block; }
  /* 只有一件时给到半宽 —— 1/3 宽是为三件排布定的,单件用会显得像缩略图 */
  .qatt.row img:only-child { width: calc(50% - 3px); border-radius: 9px; }
  /* ③ 单张参考图:满宽竖版 —— 图搜的输入通常是手机截图/街拍照,
     用 16:10 会把竖图裁成一条,3:4 才留得住人和单品 */
  .qatt.one { position: relative; }
  .qatt.one img { width: 100%; aspect-ratio: 3/4; object-fit: cover;
    border-radius: 9px; background: #F3F4F6; display: block; }
  /* 来源+热度角标:与 scard 的 .ltag 同一手法 —— 图先被看到,来源不必等读文字。
     压在图上而非另起一行,因为它是图的元信息,不是卡的内容层。 */
  .qatt.one .atag { position: absolute; left: 8px; top: 8px;
    background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-radius: 6px; padding: 3.5px 6px; box-shadow: 0 1px 3px rgba(8,16,33,.10);
    font-size: 8.5px; font-weight: 700; letter-spacing: .5px; color: var(--black); }

  /* Likes 常驻角标入口 */
  .screen-body { position: relative; }
  .lk-corner { position: absolute; top: 8px; right: 14px; width: 38px; height: 38px; z-index: 20;
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lk-corner.lk-corner2 { right: 52px; }
  /* 两枚角标时,居中的第一行会顶到 ♡ 上(实测只差 6px,且纵向完全重叠)。
     居中的行不会因为容器变窄而移位,加左右留白没用 —— 只能让出纵向:
     角标提到 4px,标题从它们下沿开始。代价是顶部比单角标那版低一截,
     换不挤;这也把角标那一条读成了自己的一行,而不是压在标题肩上。 */
  /* ♡ 在 DOM 里排在 🔔 前面,用 ~ 把两枚一起提上去 */
  .lk-corner2, .lk-corner2 ~ .lk-corner { top: 4px; }
  /* 46px 是按角标的**外框**(4..42)让的,但框里的图形只有 ~16px 高、上下各空一截,
     图形实际到 31 就结束了。按框让位就在下面白空出一大块 —— 按墨迹让,34 就够。 */
  .greet.twoicon { padding-top: 34px; }
  .lk-corner .badge { position: absolute; top: 2px; right: 0; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 9px; background: var(--brand); color: #fff; font-size: 10.5px; font-weight: 700;
    line-height: 17px; text-align: center; }
  /* 数字换成点:"还剩几条没读"这个数每读一条就要跳一次,而它对决策没用 ——
     有没有,才是要不要点进去的分界。 */
  .lk-corner .dot { position: absolute; top: 3px; right: 2px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px #fff; }
  .lk-seg .sg .sdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--brand); margin-left: 5px; vertical-align: 1.5px; }

  /* PDP 内能力动作(场景预览/试穿——生成能力的落点) */
  .pdp-scene { margin: 10px 16px 0; font-size: 13px; font-weight: 600; color: var(--brand); cursor: pointer; }
  /* 策展流页(橱窗/运营落地) */
  .flow { position: absolute; inset: 0; z-index: 78; background: #fff; display: none; flex-direction: column; }
  .flow.show { display: flex; }
  .flow .fhead { flex-shrink: 0; display: flex; align-items: flex-start; gap: 10px; padding: 58px 16px 12px;
    border-bottom: 0.5px solid var(--line-06); }
  .flow .fback { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .flow .ft { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--black); line-height: 1.2; }
  .flow .fs { font-size: 12.5px; color: var(--ink); margin-top: 4px; }
  .flow .fbody { flex: 1; overflow-y: auto; padding: 14px 16px 40px; }
  .flow .fbody::-webkit-scrollbar { width: 0; }
  .flow .frefine { margin-top: 18px; text-align: center; font-size: 13px; font-weight: 600; color: var(--brand); cursor: pointer; }
  /* 会话内对比表 */
  .ctb { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; border-radius: 10px;
    overflow: hidden; font-size: 12px; }
  .ctb td { padding: 7px 9px; border-bottom: 0.5px solid var(--line-06); color: var(--text-87); vertical-align: top; }
  .ctb tr:last-child td { border-bottom: none; }
  .ctb td.k { color: var(--text-40); width: 64px; }
  .ctb td b { font-weight: 700; }
  /* Best-for 行:语义是"各有所长",两边同为中性标签,不分胜负 —— 胜负交给下面的差异行 */
  .ctb tr.bf td { padding-top: 9px; padding-bottom: 9px; }
  .ctb .bft { display: inline-block; font-size: 11px; font-weight: 700; line-height: 1.3;
    color: var(--text-87); background: rgba(8,16,33,.05); border-radius: 6px; padding: 3px 7px; }
  /* 胜出值用胶囊,不用 ✓ —— 胶囊编码"更好"而非"更大"(价格越低越好时 ✓/箭头都会歧义) */
  .ctb .w { display: inline-block; font-weight: 700; color: #15803D;
    background: rgba(21,128,61,.09); border-radius: 5px; padding: 1px 6px; }
  .cts { text-align: center; font-size: 12px; color: var(--grey-99); padding: 10px 0 4px; }

  /* ---------- Migoo app tabbar(82px / 无文字 / 27px 实心 / #D6D9E6→墨色) ---------- */
  .tabbar { flex-shrink: 0; height: 82px; background: #fff; border-top: 1px solid var(--line-06);
    display: flex; align-items: flex-start; padding-top: 10px; z-index: 55; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; color: #D6D9E6; cursor: pointer; }
  .tab.on { color: var(--black); }
  .tab svg.tabfill { width: 27px; height: 27px; }
  .tab img.logo { width: 27px; height: 27px; border-radius: 7px; object-fit: contain; filter: grayscale(1) opacity(0.55); }
  .tab.on img.logo { filter: none; }

  /* ---------- 试穿预览浮层 ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(8,16,33,0.42); z-index: 99; display: none; }
  .scrim.show { display: block; }
  .sheet { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 100;
    background: #fff; border-radius: 28px; padding: 20px 18px 16px;
    transform: translateY(140%); visibility: hidden;
    transition: transform .28s cubic-bezier(.32,.72,0,1), visibility 0s linear .28s;
    box-shadow: 0 -8px 40px rgba(8,16,33,0.18); }
  .sheet.show { transform: translateY(0); visibility: visible;
    transition: transform .28s cubic-bezier(.32,.72,0,1), bottom .26s cubic-bezier(.32,.72,0,1); }
  /* sheet 现在只剩展示型用途(试穿预览)—— 输入已统一到 composer(.cf-*) */
  .sheet .pills { display: flex; gap: 10px; margin-top: 18px; }
  .sheet .spill { flex: 1; height: 48px; border: 1px solid var(--line-09); border-radius: 24px; background: #fff;
    font-family: var(--sf); font-size: 12.5px; font-weight: 700; letter-spacing: 0.6px; color: var(--black);
    cursor: pointer; }

  /* ---------- chat overlay (会话追问) ---------- */
  /* ============================================================
     会话页(对齐线上 Migoo 会话规范:居中 Migoo/Generated by AI 头部、
     灰 AI 气泡 + 蓝用户胶囊、商品条白卡嵌灰气泡内、大商品卡带外跳)
     ============================================================ */
  .chat { position: absolute; inset: 0; z-index: 90; background: #fff; display: none; flex-direction: column; }
  .chat.show { display: flex; }
  /* ============================================================
     会话浮层(A):同一个 #chat、同一套流式管线,只是挂载方式变了。
     不另起一个组件 —— 会话是一层,不是另一个地方,这和 PDP 是同一条规则。
     底边停在 tabbar 之上:tabbar 一直露着,才说得清"你没离开电商 tab"。
     层级 88 < PDP 91/92:浮层里点商品,PDP 仍然叠在它上面。
     ============================================================ */
  /* 盖住 tabbar(模型:模态浮层)。
     曾经把底边停在 tabbar 之上,想用"tab 还亮着"证明你没离开电商 tab ——
     但那和浮层自带的遮罩自相矛盾:遮罩说"后面不能碰",露着的 tabbar 说"随时能走",
     而且此时点 Tasks 会发生什么并没有定义 —— 看得见却行为未定的控件比盖住更糟。
     "你没离开"由别的东西承载:上方一直露着的、变暗的原页面;关掉回到一模一样的
     滚动位置;没有 tab 切换的转场。这三条比一条图标带更硬。
     要退回"边逛边聊"的伴随面板形态,该去掉的是遮罩,不是把 tabbar 让出来。

     overflow:hidden 是必须的 —— .chead 自带白底,不裁的话它会盖住父级的圆角,
     顶边就成了一条直线(圆角写了却看不见)。 */
  .chat.sheetmode { inset: auto 0 0 0; top: 11%; z-index: 88; overflow: hidden;
    border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px rgba(8,16,33,.16);
    transform: translateY(100%);
    transition: transform .34s cubic-bezier(.32,.72,0,1), top .34s cubic-bezier(.32,.72,0,1); }
  /* 展开 = 同一层变高,不是换一个地方。留 5% 不铺满是有代价意识的:
     顶上那道变暗的原页面 + 露出来的圆角,是"你还没离开"唯一的证据。
     铺到 top:0 就没有圆角也没有底页了,它会被读成整页,而整页的返回该回哪里
     又是另一套语义 —— 那正是这次要拆掉的东西。 */
  .chat.sheetmode.tall { top: 4%; }
  .chat.sheetmode.show { display: flex; transform: translateY(0); }
  .chat.sheetmode.top { z-index: 96; }
  .chat.sheetmode .chead { padding: 16px 16px 10px; }
  .chat.sheetmode .cback, .chat.sheetmode .cdoc { top: 14px; }
  .chat.sheetmode .cbody { padding-bottom: 12px; }
  /* 盖住 tabbar 后,底部要自己补出 home indicator 的安全区 */
  .chat.sheetmode .cdock { padding-bottom: 26px; }
  .chat-scrim { position: absolute; inset: 0; background: rgba(8,16,33,.28);
    z-index: 87; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .chat-scrim.show { opacity: 1; pointer-events: auto; }
  .chat-scrim.top { z-index: 95; }
  .csheet-grab { position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.16); }
  /* 浮层头:身份 + 一句它管什么 + 展开到整页的逃生口 */
  .chat.sheetmode .chead .ct { font-size: 15px; }
  .cagent { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .cagent img { width: 20px; height: 20px; border-radius: 6px; }
  .cagent img { border-radius: 6px; }
  .cexp { position: absolute; right: 46px; top: 14px; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-40); }
  /* 浮起来的状态 = 同一枚头像脱离输入框,不是换一个东西。
     所以它是放大的 .askbot(46px,同样是圆),不是一条深色带文字的胶囊 ——
     那条胶囊犯的是和 52px 黑圆一样的错:为一个次要动作做成全屏最重的元素,
     而且和贴在框里时长得不像同一个对象,读不出"它只是浮起来了"。
     文字也去掉:身份由头像说,有没有新东西由绿点说,写字是第三次说同一件事。 */
  .copilot { position: absolute; right: 16px; bottom: 100px; z-index: 60; display: none;
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    align-items: center; justify-content: center; position: absolute;
    background: #fff; box-shadow: 0 8px 24px rgba(8,16,33,.22), 0 0 0 3px rgba(255,255,255,.9); }
  .copilot.show { display: flex; }
  .copilot img { width: 76%; height: 76%; object-fit: contain; }

  /* 上文分隔:重开浮层时说明这些是之前聊过的 */
  .cthread-sep { text-align: center; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-40); padding: 10px 0 6px; }
  .chat .chead { flex-shrink: 0; position: relative; padding: 54px 16px 12px; text-align: center; background: #fff; }
  .chat .chead .ct { font-size: 17px; font-weight: 600; color: var(--black); letter-spacing: -.3px; line-height: 21px; }
  .chat .chead .cs { font-size: 10.5px; color: var(--grey-99); margin-top: 1px; }
  .chat .cback { position: absolute; left: 14px; top: 52px; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .chat .cdoc { position: absolute; right: 14px; top: 52px; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .chat .cbody { flex: 1; overflow-y: auto; padding: 6px 16px 24px; }
  .chat .cbody::-webkit-scrollbar { width: 0; }
  /* 任务眉题:沿用产品里已有的写法 —— 会话里创建/修改 autotask 时,
     气泡顶部挂一条 ⏱ Auto-task updated。它不参与打字机,气泡一出现就在,
     因为"这句话改动了系统状态"是这条消息的属性,不是它说到一半才成立的事。 */
  .ma .btag { display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
    font-size: 11.5px; color: var(--text-40); letter-spacing: -.1px; }
  .ma .btag svg { flex-shrink: 0; }
  .cts { text-align: center; font-size: 12px; color: var(--grey-99); padding: 12px 0 8px; }
  .mu { display: flex; flex-direction: column; align-items: flex-end; padding: 5px 0; }
  /* 引用条贴在气泡上方,右对齐、比气泡窄 —— 是气泡的注脚而非并列内容 */
  .uref { display: flex; align-items: center; gap: 7px; max-width: 78%; margin-bottom: 5px;
    background: var(--chip-bg); border-radius: 11px; padding: 5px 9px 5px 5px; }
  .uref img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; background: #fff; flex-shrink: 0; }
  /* 多件附件:右对齐图组,尺寸与卡上 attachment 呼应,点击可进 PDP */
  .uatt { display: flex; gap: 5px; justify-content: flex-end; max-width: 78%; margin-bottom: 6px; }
  .uatt img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover;
    background: #fff; cursor: pointer; }
  /* 比例必须与卡上的 .qatt.one 一致(3:4)—— 同一张图在卡上和会话里若用不同比例,
     object-fit:cover 会裁掉不同部分。这里曾误留 16:10,把竖版照片上方的帽子整个裁没,
     而帽子正是 query 问的东西。 */
  .uatt.one { max-width: 58%; }
  .uatt.one img { width: 100%; height: auto; aspect-ratio: 3/4; object-fit: cover;
    border-radius: 10px; cursor: default; }
  .uref span { font-size: 11.5px; color: var(--text-65); line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mu .b { background: var(--brand); color: #fff; border-radius: 20px; padding: 10px 15px;
    font-size: 15.5px; line-height: 1.4; max-width: 74%; letter-spacing: -.2px; }
  .ma { padding: 5px 0; display: flex; }
  .ma .b { background: var(--migoo-say); border-radius: 20px; padding: 13px 15px; max-width: 88%;
    font-size: 15.5px; line-height: 1.45; color: var(--text-87); letter-spacing: -.2px; }
  .ma .b code { font-family: var(--mono); font-size: 13.5px; color: var(--ink); background: none; }
  /* 思考中(query 发出后的 2s) */
  .ma .b.tping { display: flex; gap: 4.5px; align-items: center; padding: 16px 16px; }
  .ma .b.tping i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-40);
    animation: tpb 1.3s ease-in-out infinite; }
  .ma .b.tping i:nth-child(2) { animation-delay: .16s; }
  .ma .b.tping i:nth-child(3) { animation-delay: .32s; }
  @keyframes tpb { 0%,60%,100% { opacity: .26; transform: translateY(0); }
                   30% { opacity: .95; transform: translateY(-3px); } }
  /* 流式光标 */
  .tcur { display: inline-block; width: 7px; height: 14px; border-radius: 1.5px;
    background: var(--text-40); vertical-align: -2px; margin-left: 2px;
    animation: tcb .9s step-end infinite; }
  @keyframes tcb { 50% { opacity: 0; } }
  /* 文字打完后富内容(商品列表/对比表)整块淡入 */
  .crich { animation: crin .34s cubic-bezier(.32,.72,0,1) both; }
  @keyframes crin { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  /* 商品条:白卡嵌在灰气泡内 */
  .plist { margin-top: 11px; display: flex; flex-direction: column; gap: 8px; }
  .prow2 { display: flex; align-items: center; gap: 11px; background: #fff; border-radius: 12px;
    padding: 9px 11px 9px 9px; cursor: pointer; }
  .prow2 img { width: 56px; height: 56px; border-radius: 9px; object-fit: cover; background: #F3F4F6; flex-shrink: 0; }
  .prow2 .pn { font-size: 13.5px; line-height: 1.3; color: var(--text-87);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .prow2 .pp { font-size: 15px; font-weight: 700; color: var(--black); margin-top: 3px; }
  /* 会话内商品网格:让"橱窗"在会话里也成立(视觉陈列 + 可对话) */
  .pgrid { display: flex; gap: 8px; margin-top: 11px; }
  .pgcol { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .pgc { background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer; }
  .pgc img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #F3F4F6; }
  .pgc .pgb { padding: 8px 9px 10px; }
  .pgc .pn { font-size: 12px; line-height: 1.3; color: var(--text-87);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pgc .pp { font-size: 13.5px; font-weight: 700; color: var(--black); margin-top: 2px; }

  /* 大商品卡:hero 图 + 名称 + 价格 + 外跳 */
  .pbig { margin-top: 11px; background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer; }
  .pbig img { width: 100%; aspect-ratio: 1/0.86; object-fit: cover; display: block; background: #F3F4F6; }
  .pbig .pb { padding: 11px 12px 12px; }
  .pbig .pn { font-size: 14px; color: var(--text-87); line-height: 1.3; }
  .pbig .pp { font-size: 18px; font-weight: 800; color: var(--black); margin-top: 3px; letter-spacing: -.3px; }
  .pbig .pbuy { font-size: 13.5px; font-weight: 600; color: var(--brand); margin-top: 9px;
    border-top: 0.5px dashed var(--line-09); padding-top: 9px; }
  .chat .cdock { flex-shrink: 0; padding: 8px 16px 10px; background: #fff; }
  .chat .cask { height: 46px; border-radius: 23px; background: var(--chip-bg);
    display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px;
    font-size: 15px; color: var(--text-40); }
  .chat .cask .sp2 { flex: 1; }

  /* ============================================================
     PDP(数据驱动的半屏 ↔ 全屏 sheet)
     ============================================================ */
  .pdp-body { flex: 1; overflow-y: auto; background: #fff; }
  .pdp-body::-webkit-scrollbar { width: 0; }
  .pdp-hero { position: relative; width: 393px; height: 393px; flex-shrink: 0; touch-action: none; }
  .pdp-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pdp-hero .indicator { position: absolute; right: 12px; bottom: 12px;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 12px; padding: 3px 9px; border-radius: 100px; }
  .pdp-close { position: absolute; top: 71px; left: 16px; z-index: 20; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12); cursor: pointer; }
  /* 只留图标,与左上角 pdp-close 对称成一对圆形按钮 —— 收藏与否靠心形填充表达,
     不必写字;点击后的承诺由 toast 说(Saved · I'll watch price & stock) */
  .pdp-watch { position: absolute; top: 71px; right: 16px; z-index: 20; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12); cursor: pointer; }
  .pdp-pad { padding: 0 16px; }
  .pdp-price { font-size: 24px; font-weight: 700; color: #000; line-height: 1.4; }
  .pdp-subnote { font-size: 12px; color: var(--text-65); margin-top: 2px; }
  .pdp-title { font-size: 16px; font-weight: 510; color: var(--text-87); line-height: 1.4; margin-top: 12px; }
  .ai-bullets { margin: 12px 16px 0; padding: 12px 8px 12px 29px; border-radius: 12px;
    background: linear-gradient(90deg, rgba(0,105,254,0.06), rgba(138,119,255,0.06)); }
  .ai-bullets li { font-size: 14px; line-height: 1.4; color: var(--text-87); }
  .section-divider { height: 6px; background: var(--section-gap); width: 100%; }
  .var-group { padding: 0 16px; margin-top: 16px; }
  .var-label { font-size: 12px; font-weight: 510; color: var(--text-65); display: inline-flex; align-items: center; gap: 2px; margin-bottom: 8px; }
  .vchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-right: 16px; }
  .vchips::-webkit-scrollbar { display: none; height: 0; }
  .vchip { flex-shrink: 0; white-space: nowrap; height: 32px; padding: 0 8px; min-width: 56px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 14px; color: var(--text-87); background: var(--chip-bg); }
  .vchip.sel { background: #fff; border: 1px solid var(--text-87); font-weight: 510; }
  .vchip.dis { color: var(--grey-bd); }
  .offers { padding: 4px 0; }
  .offer-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .offer-left { display: flex; gap: 8px; align-items: center; }
  .offer-logo { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; background: #fff;
    border: 0.5px solid rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .offer-logo img { max-width: 26px; max-height: 24px; object-fit: contain; display: block; }
  .offer-price { font-size: 14px; font-weight: 590; color: var(--text-87); }
  .offer-sub { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--text-65); }
  .offer-sub .vbar { width: 0.5px; height: 12px; background: var(--grey-bd); }
  .offer-sub .rating { display: inline-flex; align-items: center; gap: 4px; }
  .buy-btn { width: 56px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.87);
    border: 1px solid var(--line-09); font-size: 14px; font-weight: 510; color: #000;
    display: inline-flex; align-items: center; justify-content: center; }
  .offer-line { height: 0.5px; background: var(--line-09); width: 333px; margin: 0 auto; }
  .reviews { padding: 16px 0; display: flex; flex-direction: column; gap: 16px; }
  .rev-head { padding: 0 16px; display: flex; align-items: center; gap: 4px; }
  .rev-head .t { font-size: 16px; font-weight: 510; color: #111; letter-spacing: -0.38px; }
  .rev-item { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .rev-name { font-size: 12px; font-weight: 510; color: #111; }
  .rev-stars { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .rev-stars .src { font-size: 14px; color: var(--grey-99); }
  .rev-stars .vbar { width: 0.5px; height: 12px; background: var(--line-09); }
  .rev-text { font-size: 14px; line-height: 1.4; color: var(--text-87); }
  .rev-media { display: flex; gap: 8px; }
  .rev-media .m { width: 108px; height: 108px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .rev-line { height: 0.5px; background: var(--line-09); margin: 0 16px; }
  .details { padding: 22px 16px 8px; }
  .details h3 { font-size: 15px; font-weight: 600; color: var(--black); margin-bottom: 14px; }
  .spec-row { display: flex; padding: 10px 0; }
  .spec-row .k { width: 120px; font-size: 14px; color: var(--text-65); flex-shrink: 0; }
  .spec-row .v { font-size: 14px; color: var(--text-87); line-height: 1.4; }
  .details .desc { font-size: 14px; line-height: 1.5; color: var(--text-87); margin-top: 16px; }
  .pdp-dock { flex-shrink: 0; background: #fff; box-shadow: inset 0 0.5px 0 var(--line-06);
    display: flex; align-items: center; padding: 8px 16px 20px; }
  .ask-migoo { width: 93px; height: 48px; border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; cursor: pointer; }
  .ask-migoo .ask-logo { width: 24px; height: 24px; display: block; }
  .ask-migoo span { font-size: 12px; color: var(--text-65); }
  /* dock 版:和电商 tab 输入框里那枚同一个东西,就该长成同一个样子 ——
     40px 白圆 + 图缩到 76%,而不是一个 24px 小图配一行说明。
     文字去掉:头像本身就是这个 agent 的名字,写 Ask 是同一件事说两遍;
     原来的 93px 宽也一并收掉,它把 icon 和 Buy 之间撑出了一大块空。 */
  .ask-migoo.bot { width: 40px; height: 40px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 9px rgba(8,16,33,.14); margin-right: 12px; }
  .ask-migoo.bot .ask-logo { width: 76%; height: 76%; object-fit: contain; }
  .pdp-dock:has(.ask-migoo.bot) { padding-left: 14px; }
  .buy-main { flex: 1; height: 48px; border-radius: 12px; background: var(--brand); color: #fff;
    font-size: 16px; font-weight: 510; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  /* PDP 层级高于会话页(.chat 90)—— PDP 是"在当前页上唤起的一层",
     不是一个要先离开当前页才能到达的地方。层级低于会话时,从会话点商品就只能
     先 closeChat() 再开 PDP,用户被弹回电商 tab,退出 PDP 后原来的对话也没了。
     试穿 sheet(93/94)与 composer(95)仍在 PDP 之上,它们是 PDP 内部唤起的东西。 */
  .pdp-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.32);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 90; }
  .pdp-backdrop.top { z-index: 97; }
  .pdp-backdrop.show { opacity: 1; pointer-events: auto; }
  .pdp-overlay { position: absolute; left: 0; right: 0; bottom: 0; top: 10%;
    background: #fff; display: flex; flex-direction: column; overflow: hidden;
    border-radius: 18px 18px 44px 44px; transform: translateY(102%);
    transition: transform .38s cubic-bezier(.32,.72,0,1), top .32s cubic-bezier(.32,.72,0,1), border-radius .3s ease;
    z-index: 91; box-shadow: 0 -10px 34px rgba(0,0,0,0.16); }
  /* PDP 与会话浮层谁在上,取决于谁后打开 —— 写死就一定有一个方向是错的:
     从卡片进会话 → PDP 该压在会话上;从 PDP 里问一句 → 确认该压在 PDP 上。
     两边各留一个 .top,由 openPDP / chatShell 按当前状态挂。 */
  .pdp-overlay.top { z-index: 98; }
  .pdp-overlay.open { transform: translateY(0); }
  .pdp-overlay.full { top: 0; border-radius: 44px; }
  .pdp-overlay.dragging { transition: none; }
  .sheet-grabber { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.92);
    box-shadow: 0 0 4px rgba(0,0,0,0.35); z-index: 25; cursor: grab; touch-action: none; }
  .home-indicator { height: 20px; display: flex; align-items: center; justify-content: center; background: #fff; }
  .home-indicator::after { content: ""; width: 144px; height: 5px; border-radius: 100px; background: var(--black); }

  /* ============================================================
     Likes 委托台
     ============================================================ */
  .tappable{cursor:pointer;}
  .likes-overlay{position:absolute;inset:0;z-index:75;background:#fff;display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  /* 收藏列表压在 PDP 之上 —— 它是从 PDP 的 toast 里叫出来的 */
  .likes-overlay.likelist{z-index:93;}
  .ll-grid{padding:14px 16px 0;}
  .ll-empty{padding:60px 16px;text-align:center;font-size:13.5px;color:var(--text-40);}
  .likes-overlay.show{opacity:1;pointer-events:auto;}
  .lk-header{position:relative;padding:4px 16px 10px;text-align:center;border-bottom:.5px solid var(--line-06);flex-shrink:0;}
  .lk-header .t{font-size:17px;font-weight:600;color:var(--black);letter-spacing:-.3px;line-height:22px;}
  .lk-header .s{font-size:11px;color:var(--grey-99);margin-top:1px;display:flex;justify-content:center;align-items:center;gap:5px;}
  .lk-header .more{position:absolute;right:16px;top:2px;width:32px;height:32px;border:none;background:none;font-size:17px;letter-spacing:2px;color:var(--black);cursor:pointer;}
  .lk-pdot{width:5px;height:5px;border-radius:50%;background:var(--lk-good);flex-shrink:0;position:relative;}
  .lk-pdot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.2px solid var(--lk-good);opacity:0;animation:lkvp 2.4s ease-out infinite;}
  .lk-header .s.scanning .lk-pdot{background:var(--brand);}
  .lk-header .s.scanning .lk-pdot::after{border-color:var(--brand);animation-duration:1s;}
  @keyframes lkvp{0%{transform:scale(.5);opacity:.7}70%{transform:scale(1.3);opacity:0}100%{opacity:0}}
  .lk-prog{margin:0 16px;height:2px;border-radius:1px;background:var(--line-06);overflow:hidden;opacity:0;transition:opacity .2s;flex-shrink:0;}
  .lk-prog.show{opacity:1;}
  .lk-prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .5s ease;}
  .lk-navmenu{position:absolute;right:12px;top:40px;background:#fff;border:.5px solid var(--line-09);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:4px;z-index:42;display:none;min-width:180px;text-align:left;}
  .lk-navmenu.open{display:block;}
  .lk-navmenu .mi{padding:9px 12px;font-size:13px;color:var(--text-87);border-radius:8px;cursor:pointer;white-space:nowrap;}
  .lk-body{flex:1;overflow-y:auto;}
  .lk-body::-webkit-scrollbar{width:0;}
  .lk-fhead{padding:14px 16px 2px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-40);}
  .lk-card{margin:10px 16px 0;border:.5px solid var(--line-09);border-radius:14px;padding:11px 12px;box-shadow:0 1px 4px rgba(0,0,0,.03);position:relative;}
  /* 指令行:这一行才是任务本身,所以它是卡上分量最重的一行 */
  .lk-do{font-size:14px;font-weight:650;color:var(--black);letter-spacing:-.2px;line-height:1.3;margin-top:2px;}
  .lk-card.quiet .lk-do{font-size:13.5px;margin-top:0;}
  /* 商品降为被引用的对象:图小一档、名字退到次级、价格仍然要看得见 */
  .lk-card .lk-do + .lk-hd{margin-top:9px;}
  .lk-card .lk-do ~ .lk-hd img{width:46px;height:46px;border-radius:10px;}
  .lk-card .lk-do ~ .lk-hd .ttl{font-size:12.5px;font-weight:500;color:var(--text-65);}
  .lk-card .lk-do ~ .lk-hd .prc{font-size:13px;font-weight:700;margin-top:2px;}
  .lk-card.quiet .lk-do ~ .lk-hd img{width:46px;height:46px;}
  .lk-card.quiet .lk-do ~ .lk-hd .lk-ticon{width:46px;height:46px;border-radius:12px;}
  .lk-tag{font-weight:700;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;}
  /* 缩略图的基样式:早前删 atRow 时把 .at-obj 一起清掉了,只剩尺寸覆盖,
     图于是按原图尺寸铺开,把整张卡撑爆。 */
  .at-obj{flex:0 0 auto;width:38px;height:38px;border-radius:10px;overflow:hidden;background:var(--chip-bg);}
  .at-obj img{width:100%;height:100%;object-fit:cover;display:block;}
  .at-obj.ico{display:flex;align-items:center;justify-content:center;color:var(--text-65);}
  .up-day{padding:16px 16px 2px;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--text-40);}
  .up-card{padding:12px 14px 12px;}
  .up-from{margin-top:5px;}
  .up-card .up-hd{margin-top:12px;padding:8px 10px;background:var(--ref-bg);border-radius:12px;}
  .up-card .lk-acts{margin-top:11px;}
  /* B · 无容器:层只由字号建立 */
  .up-flat .up-hd.bare{background:none;padding:0;margin-top:10px;}
  .up-flat .up-hd.bare .at-obj{width:44px;height:44px;border-radius:11px;}
  .up-flat .up-hd{align-items:center;}
  /* C · 引用式:弱(引用条)/ 强(文案 + 商品绑成一体)/ 中(动作,靠更大间距断开)
     引用条的类名不能叫 .up-quote —— 卡片自身带的是 up-${upStyle} = up-quote,
     同名会让 display:inline-flex 作用到整张卡上,内容当场排成一行溢出。 */
  .up-qref{display:inline-flex;align-items:center;gap:5px;max-width:100%;
    background:var(--ref-bg);border-radius:8px;padding:4px 8px 4px 7px;cursor:pointer;
    font-size:11px;font-weight:600;color:var(--text-40);letter-spacing:-.1px;}
  .up-qref svg{width:11px;height:11px;flex-shrink:0;}
  .up-qref span:first-of-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up-qref .lk-chv{color:rgba(0,0,0,.25);}
  .up-body{margin-top:10px;}
  .up-quote-card .up-hd.bare{background:none;padding:0;}
  .up-quote-card .up-hd.bare .at-obj{width:44px;height:44px;border-radius:11px;}
  .up-quote-card .up-hd{align-items:center;}
  .up-quote-card .up-hd.tight{margin-top:8px;}
  /* 动作一律左对齐:按钮数量不定(1~2 个),
     推右边缘会让单按钮卡和双按钮卡的落点不一致,读起来是两种卡型。
     统一左起,右下角的空留着。 */
  .up-quote-card .lk-acts{margin-top:13px;}
  .up-hd{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
  .up-hd .at-obj{width:44px;height:44px;border-radius:11px;}
  .up-hd .at-obj.ico svg{width:18px;height:18px;}
  .up-bd{flex:1;min-width:0;}
  .up-name{font-size:13px;color:var(--text-87);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up-spec{font-size:12px;color:var(--text-40);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up-price{flex:0 0 auto;text-align:right;padding-left:10px;}
  .up-price b{display:block;font-size:14px;font-weight:750;color:var(--black);letter-spacing:-.2px;}
  .up-price s{display:block;font-size:11.5px;color:var(--text-40);margin-top:1px;}
  .up-task{flex:1;}
  /* 状态由句中被强调的词承担,不再头顶挂一个分类标签 */
  /* 过期的 run:降为记录 —— 它说的事已经被更新的一条取代,
     留着是为了"我不在的时候发生过什么",不是为了让你现在照着它动手。 */
  .up-card.past{opacity:.62;}
  .up-card.past .up-news{font-weight:500;color:var(--text-65);font-size:13.5px;}
  .up-news{font-size:15px;font-weight:600;color:var(--black);line-height:1.42;letter-spacing:-.2px;margin-top:10px;}
  .up-news b{font-weight:750;}
  /* N 个候选:结果是一组东西时,卡上必须看得见它们 */
  /* 卡里的横滑商品:比首页那排小一档 —— 它是这条更新的证据,不是货架本身。
     ✦ 也去掉:这一排每张卡上都挂一个"问 Migoo",和卡底下那两个按钮说的是同一件事,
     而且它把注意力从"选哪个"引到了"再问一次"。 */
  .up-picks{padding:10px 0 2px;margin:0 -14px 0 0;gap:8px;}
  .up-picks .hcard{flex:0 0 104px;width:104px;}
  .up-picks .sparkb{display:none;}
  .up-picks .cap{padding:6px 0 0;}
  .up-picks .cap .ttl{font-size:11.5px;line-height:1.3;}
  .up-picks .cap .pr{font-size:12.5px;margin-top:2px;}
  .up-task{font-size:11.5px;font-weight:600;color:var(--text-40);letter-spacing:-.1px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up-task .lk-chv{color:rgba(0,0,0,.25);}
  .up-hd{margin-top:8px;}
  .up-list{margin-top:10px;background:var(--chip-bg);border-radius:11px;overflow:hidden;}
  .up-li{display:flex;align-items:center;gap:10px;padding:8px 11px;font-size:12px;color:var(--text-87);}
  .up-li + .up-li{border-top:.5px solid rgba(0,0,0,.05);}
  .up-li .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up-li .lp{font-weight:700;color:var(--black);}
  .up-li .best{margin-left:7px;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--lk-good);background:rgba(30,158,84,.1);border-radius:5px;padding:2px 5px;}
  .lk-ago{font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-40);margin-left:6px;}
  /* 依据:结论之后退一档的第二句 —— 助理给结论,并且交代凭什么这么说。
     Keepa 之流只甩一张价格曲线让你自己判断,那是工具的做法。 */
  .lk-note .ev2{display:block;margin-top:5px;color:var(--text-40);font-size:11px;line-height:1.45;}
  .lk-tag.scarce{color:var(--lk-scarce);} .lk-tag.inkt{color:var(--ink);} .lk-tag.deal{color:var(--lk-good);}
  .lk-hd{display:flex;gap:11px;align-items:center;margin-top:9px;}
  .lk-hd img{width:56px;height:56px;border-radius:11px;object-fit:cover;flex-shrink:0;}
  .lk-hd .bd{flex:1;min-width:0;}
  .lk-hd .ttl{font-size:13.5px;font-weight:650;color:var(--black);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lk-hd .mdl{font-size:11.5px;color:var(--text-40);margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lk-hd .prc{font-size:14px;font-weight:800;letter-spacing:-.2px;margin-top:4px;color:var(--black);}
  .lk-mono{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.15px;}
  .lk-ink{color:var(--ink);}
  .lk-delta{font-size:11px;font-weight:600;margin-left:5px;}
  .lk-note{margin-top:9px;border-radius:9px;padding:7px 10px;font-size:11.5px;line-height:1.45;color:#3a3a3c;}
  .lk-note.scarcebg{background:rgba(199,116,0,.07);}
  .lk-note.inkbg{background:rgba(51,80,122,.055);}
  .lk-note.goodbg{background:rgba(30,158,84,.07);}
  /* 运行记录:没事发生也要说一句 —— 旧的任务页只有配置,看不出它跑没跑;
     只报结果又会让安静的任务像是死了。所以每一行恒有一句"最近一次怎么样",
     有事时它升级成带底色的事件行,没事时就是一句灰字。 */
  .lk-note.run{background:none;padding:5px 2px 0;font-size:11px;color:var(--text-40);}
  .lk-acts{display:flex;gap:6px;margin-top:10px;align-items:center;}
  .lk-btn{font-family:var(--sf);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;border:1px solid #DCDFE4;background:#fff;color:var(--text-87);}
  /* 蓝实心只给"买" —— 它是唯一要花钱的动作,颜色就该只标这一件事。
     一张卡上没有购买动作(比如挑礼物),那它就没有蓝按钮,两个描边按钮并列即可:
     这本身也是诚实的信息 —— 现在还轮不到下单。 */
  .lk-btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;}
  /* 全部收藏区:卡型与更新卡完全相同,但把视觉重量收回去。
     Updates 那三张是"有事发生了,现在该动手",蓝色实心按钮是这个信号;
     这一区八张什么也没发生,再来八个实心蓝,蓝就不再是信号,只剩底噪 ——
     整页读起来像八条待办,而它其实是一个货架。
     收法:蓝退成浅色底(与 composer 能力标签同一种淡蓝,不引入新色)、
     行距压紧、图放大一档 —— 让眼睛落在货上,不落在按钮上。 */
  .lk-card.menuup{z-index:30;}
  /* 无宿主对象的任务:没有商品图,用一个能力记号占住同样的位置,
     其余排版与商品卡完全一致 —— 同一页里不该有两种卡型的读法。 */
  .lk-ticon{flex:0 0 auto;width:56px;height:56px;border-radius:14px;background:var(--chip-bg);
    display:flex;align-items:center;justify-content:center;color:var(--text-65);}
  .lk-ticon svg{width:22px;height:22px;}
  .lk-card.quiet .lk-ticon{width:70px;height:70px;border-radius:12px;}
  .lk-card.quiet{padding:11px 12px;margin-top:8px;}
  .lk-card.quiet .lk-hd{margin-top:0;align-items:flex-start;}
  .lk-card.quiet .lk-hd img{width:70px;height:70px;border-radius:12px;}
  .lk-card.quiet .lk-hd .prc{margin-top:5px;}
  .lk-card.quiet .lk-acts{margin-top:7px;gap:5px;}
  .lk-card.quiet .lk-btn{font-size:11px;padding:5px 10px;}
  .lk-card.quiet .lk-btn.pri{background:rgba(0,122,255,.10);border-color:transparent;color:var(--brand);}
  /* 已设的线:价格后面一段灰色元数据,不可点,和上面规格行同一档。
     它是这件东西的一个事实,不是控件 —— 之前做成蓝色可点文字有两个毛病:
     和同色同形的 Buy now 药丸读成一对按钮;而且"点一段文字去改设置"
     本身不是一个能被认出来的手势。改设置归 ⋯ 菜单,那是这张卡放选项的地方。 */
  .lk-target{margin-left:7px;font-family:var(--sf);font-size:11.5px;font-weight:500;
    letter-spacing:-.1px;color:var(--text-40);}
  .lk-card.quiet .lk-kebab{height:24px;}
  .lk-card.quiet .lk-menu{bottom:auto;top:100%;right:0;}
  .lk-kebab{margin-left:auto;width:30px;height:26px;border-radius:8px;border:none;background:transparent;color:var(--text-40);font-size:15px;cursor:pointer;line-height:1;}
  .lk-menu{position:absolute;right:10px;bottom:44px;background:#fff;border:.5px solid var(--line-09);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:4px;z-index:20;display:none;min-width:180px;}
  .lk-menu.open{display:block;}
  .lk-menu .mi{padding:9px 12px;font-size:12.5px;color:var(--text-87);border-radius:8px;cursor:pointer;white-space:nowrap;}
  .lk-menu .mi.danger{color:#E8442B;}
  .lk-sec{padding:15px 16px 4px;border-top:8px solid var(--section-gap);margin-top:14px;}
  .lk-sec .st{font-size:13px;font-weight:700;color:var(--black);}
  /* 任务行:等高、可扫。没有商品卡的排版,也没有一次性的动作按钮。 */
  .at-list{padding:6px 0 0;}
  .at-card{margin:10px 16px 0;border:.5px solid var(--line-09);border-radius:14px;padding:13px 14px;
    box-shadow:0 1px 4px rgba(0,0,0,.03);transition:box-shadow .45s ease,border-color .45s ease;}
  /* 从 Updates 的引用行跳过来时,那张卡自报家门 —— 蓝环一闪即散,
     不留任何常驻状态(选中态会让用户以为要再点一次才生效)。
     用 transition 不用 animation:.at-card 的 animation 槽位被入场的 lkrise 占着。 */
  .at-card.at-hit{box-shadow:0 0 0 4px rgba(0,122,255,.18),0 1px 4px rgba(0,0,0,.03);
    border-color:rgba(0,122,255,.55);}
  .at-hd{display:flex;align-items:center;gap:10px;}
  .at-name{flex:1;min-width:0;font-size:14.5px;font-weight:650;color:var(--black);letter-spacing:-.2px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .at-rule2{font-size:13px;color:var(--text-87);margin-top:9px;line-height:1.35;}
  /* 商品 = 这条任务的附件,不是它的一部分 */
  .at-ref{display:flex;align-items:center;gap:9px;margin-top:9px;padding:6px 10px 6px 6px;
    background:var(--ref-bg);border-radius:11px;cursor:pointer;}
  .at-ref img{width:32px;height:32px;border-radius:8px;object-fit:cover;background:#fff;flex-shrink:0;}
  .at-ref .rt{flex:1;min-width:0;font-size:12px;color:var(--text-87);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .at-ref .rp{font-size:12.5px;font-weight:700;color:var(--black);}
  .at-notify{font-size:11.5px;color:var(--grey-99);margin-top:3px;}
  .at-adj{width:100%;margin-top:11px;height:38px;border-radius:10px;background:#fff;
    border:1px solid rgba(0,122,255,.45);color:var(--brand);font-family:var(--sf);
    font-size:13.5px;font-weight:600;cursor:pointer;}
  /* 开关常驻在行上 —— 每一个同类产品都把它当一等动作(ChatGPT pause、
     Shortcuts/Gemini toggle、Datadog mute),因为任务不合适时用户的第一反应
     是"先关掉"而不是删掉(删掉就丢了配置)。藏进 ⋯ 是把最高频的动作埋了。 */
  .at-sw{flex:0 0 auto;width:40px;height:24px;border-radius:12px;background:#E3E5EA;
    position:relative;cursor:pointer;transition:background .18s;}
  .at-sw.on{background:var(--lk-good);}
  .at-sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s;}
  .at-sw.on i{transform:translateX(16px);}
  .lk-addbar{flex-shrink:0;display:none;padding:8px 16px 10px;background:#fff;
    border-top:.5px solid var(--line-06);}
  .lk-addbar.show{display:block;}
  .lk-addbtn{width:100%;height:46px;border-radius:13px;border:none;background:var(--brand);color:#fff;
    font-family:var(--sf);font-size:15px;font-weight:600;letter-spacing:-.2px;cursor:pointer;}
  /* 分段控件:两个面是同级的两个视图,不是"一个列表 + 一个筛选"。
     胶囊并排读起来是筛选(可以都不选);滑块在槽里读起来是切换(必有一个在)。
     选中态由"哪一格是白的"说,不靠深色实心 —— 深色实心在这一页已经是别的意思。 */
  .lk-seg{display:flex;margin:12px 16px 2px;padding:2px;background:var(--chip-bg);border-radius:999px;}
  .lk-seg .sg{flex:1;text-align:center;font-size:13.5px;font-weight:600;color:var(--text-65);
    padding:7px 0;border-radius:999px;cursor:pointer;transition:color .18s ease;letter-spacing:-.1px;}
  .lk-seg .sg.on{background:#fff;color:var(--black);
    box-shadow:0 1px 3px rgba(8,16,33,.10),0 0 0 .5px rgba(0,0,0,.04);}
  .lk-filter{display:flex;gap:7px;padding:12px 16px 2px;}
  .lf{font-size:12px;font-weight:600;color:var(--text-65);background:#fff;border:1px solid var(--line-09);
    border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
  .lf.on{background:#081021;border-color:#081021;color:#fff;}
  .lk-chv{color:rgba(0,0,0,.28);}
  .lk-reveal{opacity:0;transform:translateY(8px);animation:lkrise .4s ease forwards;}
  @keyframes lkrise{to{opacity:1;transform:none;}}
  .lk-toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(17,17,20,.92);color:#fff;font-size:12px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;z-index:80;max-width:88%;overflow:hidden;text-overflow:ellipsis;}
  .lk-toast.show{opacity:1;}

  /* ============================================================
     模拟键盘 + composer 聚焦态(对齐线上 Migoo 输入规范)
     ============================================================ */
  .kbd { position: absolute; left: 0; right: 0; bottom: 0; height: 291px; z-index: 102;
    background: #D1D4DA; padding: 8px 3px 0; transform: translateY(100%);
    transition: transform .26s cubic-bezier(.32,.72,0,1); }
  .kbd.show { transform: translateY(0); }
  .kbd .krow { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; }
  .kbd .k { flex: 1; max-width: 33px; height: 42px; background: #fff; border-radius: 5px;
    box-shadow: 0 1px 0 rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 400; color: #000; letter-spacing: 0; }
  .kbd .k.wide { max-width: 44px; background: #ADB3BC; }
  .kbd .k.space { max-width: 172px; }
  .kbd .k.go { max-width: 62px; background: #ADB3BC; font-size: 16px; }
  .kbd .krow.last { padding: 0 4px; }
  .kbd .khome { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); }

  .cfocus { position: absolute; inset: 0; z-index: 101; display: none; }
  .cfocus.show { display: block; }
  .cfocus .cf-scrim { position: absolute; inset: 0; background: rgba(255,255,255,.72);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .cf-dock { position: absolute; left: 0; right: 0; bottom: 291px; padding: 0 12px 10px; }
  /* 裸建议行没有自己的底,直接压在虚化的商品图上会花(尤其压到红色商品卡)。
     只在这一态给 dock 加一层向上渐隐的白 —— 行落在近白底上,又不至于变成一块硬白板。
     query chips 态自带白色 pill,不需要这层,故用 .fade 限定。 */
  .cf-dock.fade { padding-top: 44px;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 0, #fff 44px); }
  .cf-chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 10px; }
  .cf-chips::-webkit-scrollbar { height: 0; }
  .cf-chip { flex: 0 0 auto; font-size: 13.5px; color: var(--text-87); background: #fff;
    border: 1px solid var(--line-09); border-radius: 999px; padding: 9px 15px; cursor: pointer;
    white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  /* 能力 chip:方一点 + 带 icon,与整句 query 的全圆 pill 区分(同 .achip.cap) */
  .cf-chip { display: inline-flex; align-items: center; gap: 6px; }
  .cf-chip.capchip { border-radius: 12px; }
  .cf-chip .ci { display: flex; color: var(--text-40); }
  /* 能力的二级推荐 query:裸行 + 行末 ↘,不做成白卡也不加分隔线 ——
     这一层是"可以这么说"的候选,不是一份需要框起来的清单;
     裸行浮在 scrim 上,视觉重量低于下方输入框,主次不会打架。
     整句四五十字符,横排 chip 只能露一半,故一行一条竖排。 */
  .cf-sugs { padding: 0 8px 10px; }
  .cf-sug { display: flex; align-items: center; gap: 12px; padding: 9px 6px; cursor: pointer;
    font-size: 15px; color: var(--text-87); letter-spacing: -.2px; }
  .cf-sug .st { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cf-sug .sa { flex-shrink: 0; display: flex; color: var(--text-40); }
  /* 动作型条目(停掉这条任务):不是"可以这么说",而是按下去就发生 —— 不给插入箭头 */
  .cf-sug.act .st { color: var(--lk-bad, #D93B3B); }
  /* 能力标签:与商品引用条同一个位置、同一个"可摘"手势,只是挂的是范围而不是对象。
     用蓝系浅底 —— 它是一个正在生效的状态,不是一件静态附件,需要与灰底的商品引用区分开。 */
  .cf-tag { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px;
    background: rgba(0,122,255,.10); color: var(--brand); border-radius: 9px;
    padding: 5px 7px 5px 9px; font-size: 12.5px; font-weight: 600; letter-spacing: -.1px; }
  .cf-tag .ci { display: flex; }
  .cf-tag .tx { display: flex; align-items: center; cursor: pointer; opacity: .75; margin-left: 1px; }
  .cf-tag .tx svg { width: 13px; height: 13px; }
  /* ---- opt41:composer 作为会话浮层的 dock ----
     不是另开一个浮层,是同一层底部那一行换了内容。所以这里全部走覆盖,
     复用 .cf-* 的每一个部件(引用条、光标、发送键),只去掉它作为独立浮层时
     才需要的东西:自己的白卡阴影和圆角。 */
  /* dock 本身不是一块板 —— 它只是个容器。谁浮起来由里面的部件自己决定。 */
  .chat .cdock.composing { padding: 0 16px 10px; background: transparent; position: relative; }
  /* 4-2 的裸行改成盖在会话上的一层:不占布局,线程就不会被推;
     顶部全透明让上一条气泡还露着一截 —— 那一截就是"我浮在你的对话上面"这句话。
     往下渐白到不透明,行落在近白底上才读得清。 */
  .cdock.composing .cf-sugs { position: absolute; left: 0; right: 0; bottom: 100%;
    padding: 52px 24px 12px;
    /* 渐变必须在第一行开始之前(52px)就走到不透明 —— 让它慢慢渐,
       第一条建议就压在气泡上,读不清。透明的那一段全部落在留白里。 */
    background: linear-gradient(to bottom, rgba(255,255,255,0) 0, #fff 52px); }
  /* chips 横滑,负边距铺到浮层左右边缘 —— 右侧那半个被切住的 chip
     就是"还有,往右划"的全部提示,缩在内边距里反而看不出能滑。 */
  .cdock.composing .cf-chips { margin: 0 -16px 10px; padding: 0 16px; flex-wrap: nowrap; }
  /* 默认态 / 商品态:chips 裸在上方,输入是一张浮起来的白卡。
     两者不合并 —— 建议是"可以这么说"的候选,不是输入框的一部分。 */
  /* position:relative 是必须的 —— 上方那层建议是 absolute,而定位元素会盖在
     静态流内元素之上,不给这张卡定位,它的上边框和向上的投影会被那层白底糊掉。 */
  .cdock.composing > .cf-input { position: relative; background: #fff; border-radius: 20px;
    padding: 14px 14px 10px; box-shadow: 0 2px 14px rgba(8,16,33,.10), 0 0 0 .5px rgba(0,0,0,.05); }
  /* 能力选中态:此刻建议是这个能力的一部分,才和输入合成同一张面板 */
  .dk-panel { background: #fff; border-radius: 20px; padding: 0 14px 10px;
    box-shadow: 0 2px 14px rgba(8,16,33,.10), 0 0 0 .5px rgba(0,0,0,.05); }
  .dk-panel .cf-chips { margin: 0 -14px 0; padding: 0 14px 11px; }
  .dk-panel .cf-input { box-shadow: none; background: transparent; border-radius: 0;
    padding: 12px 0 0; border-top: .5px solid var(--line-09); }
  /* 两行横滑:两条各自 max-content 的行叠在同一个横滚容器里。
     不用 grid —— grid 的列宽由同列最宽的一项决定,短句后面会拖一大截空白。 */
  .cf-chips.rows2 { display: block; }
  .cf-chips.rows2 .r { display: flex; gap: 8px; width: max-content; }
  .cf-chips.rows2 .r + .r { margin-top: 8px; }
  /* 能力选中态:能力从"输入框里的一枚标签"升格成这一段的抬头 ——
     它此刻是整个 dock 的范围,不只是输入框的一个附件。× 摘掉即退回空态。 */
  .dk-cap { display: flex; align-items: center; gap: 7px; padding: 13px 0 10px;
    font-size: 15px; font-weight: 650; color: var(--black); letter-spacing: -.2px; }
  .dk-cap .ci { display: flex; color: var(--text-40); }
  .dk-cap .dx { margin-left: auto; display: flex; cursor: pointer; color: var(--text-40); }
  /* 键盘顶上来时浮层要让位 —— 底边抬到键盘上沿,而不是被压在下面。
     类名不能叫 .kbd:那是键盘元素自己的类(height:291 / 灰底),
     挂到浮层上会让浮层整个继承键盘的长相。 */
  /* 键盘占掉 291px 后剩的地方本来就少,composer 自己又高(建议 + 引用条 + 输入),
     再按常态那个 top 起,线程只剩一条缝 —— 起得更高一点,让上文还看得见。 */
  .chat.sheetmode.kbdup { top: 6%; bottom: 291px; }
  .chat.sheetmode.kbdup.tall { top: 4%; }
  .chat.sheetmode.kbdup .cdock { padding-bottom: 10px; }

  .cf-input { background: #fff; border-radius: 20px; padding: 14px 14px 10px;
    box-shadow: 0 2px 14px rgba(8,16,33,.10), 0 0 0 0.5px rgba(0,0,0,.05); }
  /* 商品引用条:点商品 ✦ = 唤起同一个输入框,只是预先引用了这件商品(附件范式) */
  .cf-quote { display: flex; align-items: center; gap: 9px; padding: 6px 8px 6px 6px;
    background: var(--chip-bg); border-radius: 13px; margin-bottom: 11px; }
  .cf-quote img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover;
    background: #fff; flex-shrink: 0; }
  .cf-quote .qi { flex: 1; min-width: 0; }
  .cf-quote .qb { font-size: 12px; font-weight: 600; color: var(--text-87); line-height: 1.25; }
  /* 一行版:整条压到一行,名字放大一档(它现在是这条里唯一的字) */
  .cf-quote.one { padding: 5px 8px 5px 5px; }
  .cf-quote.one img { width: 30px; height: 30px; border-radius: 7px; }
  .cf-quote.one .qb { font-size: 12.5px; font-weight: 500; color: var(--text-87);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cf-quote .qn { font-size: 11.5px; color: var(--text-40); line-height: 1.3; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cf-quote .qx { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; color: var(--text-40); }
  .cf-text { font-size: 16.5px; line-height: 1.35; color: var(--text-87); min-height: 22px;
    letter-spacing: -.2px; word-break: break-word; }
  .cf-text.ph { color: var(--text-40); }
  .cf-text .caret { display: inline-block; width: 2px; height: 18px; background: var(--brand);
    vertical-align: -3px; margin-left: 1px; animation: cfblink 1.1s step-end infinite; }
  .cf-text .caret.lead { margin-left: 0; margin-right: 3px; }
  @keyframes cfblink { 50% { opacity: 0; } }
  .cf-row { display: flex; align-items: center; margin-top: 12px; }
  .cf-row .sp3 { flex: 1; }
  .cf-row .ic { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .cf-send { width: 34px; height: 34px; border-radius: 50%; background: var(--brand);
    display: flex; align-items: center; justify-content: center; margin-left: 6px; cursor: pointer;
    transition: opacity .15s; }
  .cf-send.off { opacity: .35; }

  /* 放得下就一行(自然保持药丸形),放不下就换行 —— 不再横向溢出到机身外面。
     带动作时用 flex+wrap:一行挤不下,动作自己掉到第二行,不会把文字挤没。 */
  .toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px);
    background: rgba(8,16,33,0.92); color: #fff; font-size: 12.5px; font-weight: 500;
    border-radius: 18px; padding: 9px 16px; z-index: 103; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    max-width: calc(100% - 32px); text-align: center; line-height: 1.4; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* width:max-content 是必须的 —— 绝对定位的 flex 容器会 shrink-to-fit,
     换行后它会自己挑一个很窄的宽度(实测 197px / 5 行),把一句话拧成一条。
     先按内容取宽,再由 max-width 收住,才会是"能一行就一行,不行才换"。 */
  .toast.has-act { pointer-events: auto; padding: 9px 10px 9px 16px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px;
    width: max-content; }
  .toast .tmsg { flex: 0 1 auto; }
  .toast .tact { padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,.16); color: #fff; font-weight: 600; cursor: pointer; }

  /* ---------- side notes ---------- */
</style>
</head>

const A = 'assets/';
const P = {

const statusbar = () => `<div class="statusbar"><span class="time">9:41</span><span class="icons">${IC.sig}${IC.wifi}${IC.batt}</span></div>`;

const cap = (id, showWhy) => { const p=P[id]; return `
  <div class="cap">
    <div class="ttl">${p.brand} ${p.nm}</div>
    <div class="pr">$${p.pr}</div>
    ${/* 理由行是这张卡唯一解释"为什么是它"的地方。
         没有别的理由但你收藏过时,那就是理由 —— 一句话,不是一个角标。 */''}
    ${(() => { const why = p.why || ((LIKE_SPLIT && saved.has(id)) ? 'You liked this' : '');
        return (showWhy && why) ? `<div class="why">${why}</div>` : ''; })()}
  </div>`; };

const imgw = (id, liked) => { const p=P[id]; return `
  <div class="imgw">
    <img src="${p.img}" alt="">
    ${/* 这枚角标只出现在 auto-task 的更新卡上(scard),普通推荐卡从来没有 ——
         所以它回答的一直是"这张卡为什么在这儿",位置和条件都对,错的只是名词:
         它曾经写 You liked,而这张卡在这儿和收藏毫无关系,是一条任务跑出了结果。
         值这块地方的理由:一屏推荐里有一张是**新闻**不是推荐,
         这件事该在读到文字之前就被看见 —— 下面那行理由是读的,角标是扫的。
         收藏本身不进角标:它是一条推荐依据,归价格下面那行。 */''}
    ${liked ? `<div class="ltag">${(WATCH_MODE || LIKE_SPLIT) ? IC.bellSm : IC.heartSm}<span>${(WATCH_MODE || LIKE_SPLIT) ? 'Auto-task' : 'You liked'}</span></div>` : ''}
    <div class="sparkb" onclick="event.stopPropagation();openSheet('${id}')">${IC.spark}</div>
  </div>`; };

const hcard = (id) => { const p=P[id]; return `
  <div class="hcard" onclick="openPDP('${id}')">${imgw(id)}
    <div class="cap">
      <div class="ttl">${p.brand} ${p.nm}</div>
      <div class="pr">$${p.pr}</div>
      ${SAVE_EVENTS[id] ? `<div class="why ev">${SAVE_EVENTS[id]}</div>` : ''}
    </div>
  </div>`; };
const gcard = (id) => `<div class="gcard" onclick="openPDP('${id}')">${imgw(id)}${cap(id,true)}</div>`;

/* 收藏更新卡:复用商品卡的全部排版,不引入新字号 ——
   它本来就是货(白底),只是多了一层"你收藏过 + 现在变了"。
   ♥ 是与普通推荐理由行的唯一区分符:两者共用 .why 的字号与色值,
   若再加底色或边框就会变成第五种卡型,与刚统一的插卡语言打架。 */
const scard = (id) => { const p=P[id], u=SAVED_UPDATES[id]; return `
  <div class="gcard scard" onclick="openPDP('${id}')">${imgw(id, true)}
    <div class="cap">
      <div class="ttl">${p.brand} ${p.nm}</div>
      <div class="pr">$${p.pr}</div>
      <div class="why ev">${u.ev}</div>
      ${u.buy ? `<button class="buynow" onclick="event.stopPropagation();toast('→ 下单确认页 · ${p.brand}(不直接扣款)')">Buy now</button>` : ''}
    </div>
  </div>`; };

const secHead = (t, s) => `
  <div class="sec-head" onclick="toast('Section landing — full flow (P1)')">
    <div><div class="t">${t}</div><div class="s">${s}</div></div>
    <span class="chev">${IC.chev}</span>
  </div>`;

/* ============================================================
   query 卡 —— 全流只有两类卡:商品(含收藏更新)与 query。
   四种旧卡型(问句/对比/接续/橱窗)收敛为同一个框架:
       引号 + query 文案 + 可选 attachment
   attachment 的形态决定它"看起来像"哪种旧卡,但结构是一个:
       无          → 类目级困惑,还没有候选
       pk:[a,b]    → 两件对撞(旧对比卡)
       ids:[…]     → 聊过的几件(旧接续卡)
       img         → 一张独立参考图 —— attachment 不必是商品
   点击一律 = 把这条 query 连同 attachment 发进会话,不做别的分支。
   ============================================================ */
const SHORTNM = { keenz:'Keenz Air', doona:'Doona Nitro' };
/* 文案铁律:必须是用户能原话说出口的句子 —— 点击就是把它发出去,
   所以一律第一人称视角("my October flight"),不能写成 Migoo 对用户说话的"your"。 */
const QCARDS = {
  stroller: { q:'Which stroller for city + travel?' },
  flight:   { q:'Which one for my October flight to Tokyo?', pk:['keenz','doona'] },
  chairs:   { q:'Keep looking for dining chairs for a small apartment under $150?',
              ids:['chair','chair2','chair3'] },
  /* 图搜:attachment 是用户看到的原图,Migoo 从图里认出单品再给可买的同款。
     与"名人同款"形态的区别就在这里 —— 那种做法卡上直接放商品(已识别的结果),
     这种放原照片,把"从图里找"这个动作留在卡上,才接得住图搜的预期。
     ⚠ 真人名人照:照片版权通常属娱乐媒体/图片社,肖像权属本人。
     内部评审可用;对外发布前须换图或取得授权。 */
  hat:      { q:"Where can I get Taylor Swift's hat?", img:'ref-taylor.jpg' },
};
const qcard = (key) => { const c = QCARDS[key]; return `
  <div class="qcard${(c.pk||c.ids||c.img) ? '' : ' bare'}" onclick="askQ('${key}')">
    <div class="q">${c.q}</div>
    ${c.pk ? `<div class="qatt pk">
      ${c.pk.map(id=>`<div class="cside"><img src="${P[id].img}"><div class="cn">${SHORTNM[id]}</div></div>`).join('')}
      <span class="vs">PK</span>
    </div>` : ''}
    ${c.ids ? `<div class="qatt row">${c.ids.map(id=>`<img src="${P[id].img}">`).join('')}</div>` : ''}
    ${c.img ? `<div class="qatt one"><img src="${A}${c.img}">${c.tag ? `<span class="atag">${c.tag}</span>` : ''}</div>` : ''}
  </div>`; };
/* 试穿(Try it on):服饰类能力,入口 = ✦ composer chip + PDP 动作 */

const home = () => {
  /* 首页商品零重复:Worth a look=sneaker/phones/watch;插卡内商品=keenz+doona(对比)/lamp+keyboard(橱窗)/chair(接续);
     以下 12 件只在流内出现一次。
     插卡排布规则:cells 按 i%2 分列,故 index 差 2 = 同列相邻、差 1 = 左右并排。
     四张插卡放在 3 / 6 / 11 / 14 —— 两两间隔 ≥3,同列内各隔 3 个商品卡,
     且不与首屏前两坑重合(问句卡最早出现在右列第 2 位)。 */
  const cells = MIX_UPDATES ? [
    /* MIX_UPDATES 态:顶部不设独立入口区,收藏更新直接进流(配额见 FEED_UPDATE_QUOTA)。
       四张 query 卡覆盖四种 attachment 形态,顺序上尽量拉开。 */
    scard('sneaker'),   gcard('tote'),
    gcard('backpack'),  qcard('stroller'),
    gcard('sunglasses'),gcard('perfume'),
    qcard('flight'),    gcard('speaker'),
    gcard('bottle'),    scard('phones'),
    gcard('sneaker2'),  gcard('mug'),
    scard('watch'),     gcard('candle'),
    gcard('moka'),      qcard('hat'),
    gcard('camera'),    gcard('vase'),
    gcard('plant'),     gcard('throwbl'),
    qcard('chairs'),    gcard('wallet'),
  ] : [
    gcard('tote'),      gcard('sunglasses'),
    gcard('backpack'),  qcard('stroller'),
    gcard('bottle'),    gcard('perfume'),
    qcard('flight'),    gcard('speaker'),
    gcard('sneaker2'),  gcard('mug'),
    gcard('moka'),      qcard('hat'),
    gcard('candle'),    gcard('vase'),
    gcard('plant'),     gcard('camera'),
    qcard('chairs'),    gcard('throwbl'),
    gcard('wallet'),
  ];
  /* 分列按累计高度贪心,而非奇偶交替 —— 后者不看高度,一旦某列多分到两张 scard(337px)
     就会比对列长出近 400px,尾部露出一大片空白。
     query 卡的高度随 attachment 形态而变,故按形态分别估值。 */
  const CARD_H = { scard:337, gcard:296, qbare:122, qpk:199, qrow:195, qone:220 };
  const cellType = (html) => {
    if (html.indexOf('class="gcard scard') >= 0) return 'scard';
    if (html.indexOf('class="qcard') >= 0) {
      if (html.indexOf('qatt pk')  >= 0) return 'qpk';
      if (html.indexOf('qatt row') >= 0) return 'qrow';
      if (html.indexOf('qatt one') >= 0) return 'qone';
      return 'qbare';
    }
    return 'gcard';
  };
  /* 纯按高度贪心会把矮的 query 卡全塞进同一列(它们不容易把该列顶高),导致特殊卡同列相邻。
     故加一条让位规则:若首选列的末尾已是特殊卡,本张特殊卡改投另一列。
     高度平衡稍作牺牲,换来特殊卡在两列里始终隔着商品卡。 */
  const c1=[], c2=[], last=[null,null]; let h1=0, h2=0;
  cells.forEach(html => {
    const t = cellType(html), h = (CARD_H[t] || 296) + 10;   /* +10 = grid 行间距 */
    let k = h1 <= h2 ? 0 : 1;
    if (t !== 'gcard' && last[k] && last[k] !== 'gcard') k = 1 - k;
    if (k === 0) { c1.push(html); h1 += h; } else { c2.push(html); h2 += h; }
    last[k] = t;
  });
  return `
  <div class="screen-body" id="sb">
    ${/* like 分家之后顶部是两个入口,它们通向两个不同性质的地方:
         ♡ = 我记下的东西(纯列表,没有 agent)
         🔔 = 它替我在跑的事(run / task,带未读点)
         并排放不是重复 —— 重复的判定看"点了到哪儿",这两个落点毫无交集。
         ♡ 永远不带点:收藏不会自己发生变化,没有"未读"这回事。 */''}
    ${LIKE_SPLIT ? `<div class="lk-corner lk-corner2" onclick="openLikeList()" aria-label="Likes">${IC.heartHead}</div>` : ''}
    <div class="lk-corner" onclick="openLikes()">
      ${WATCH_MODE ? IC.bellHead : IC.heartHead}${AT_RUNS ? (upUnread ? '<span class="dot"></span>' : '') : (upUnreadN ? `<span class="badge">${upUnreadN}</span>` : '')}
    </div>
    <div class="greet${LIKE_SPLIT ? ' twoicon' : ''}">What are we looking for today?</div>
    ${(() => {
      const askRow = `<div class="askrow">
    ${(CHAT_SHEET && !CHAT_DOCK) ? `<div class="askbot${CHAT_AGENT ? '' : ' migoo'}" id="askbot" onclick="openCopilot()" aria-label="Open conversation"></div>` : ''}
    <div class="ask${(CHAT_SHEET && CHAT_DOCK) ? ' withbot' : ''}" onclick="openFocus()">

/* ---------- PDP bottom sheet(half ↔ full 手势,移植) ---------- */
let sheetDrag = null;
let currentPdpId = null;
function openPDP(id){
  if (!PDPD[id]) { toast('No PDP for this item'); return; }
  currentPdpId = id;
  const ov = document.getElementById('pdp');
  ov.innerHTML = pdpHTML(id);
  ov.classList.remove('full');
  const chatUp = document.getElementById('chat')?.classList.contains('show');
  ov.classList.toggle('top', !!chatUp);
  const bd = document.getElementById('pdpBackdrop');
  bd.classList.toggle('top', !!chatUp);
  bd.classList.add('show');
  ov.classList.add('open');
  attachSheetDrag(ov);
}
function closePDP(){
  const ov = document.getElementById('pdp');
  ov.classList.remove('open','full','top');
  document.getElementById('pdpBackdrop').classList.remove('show','top');
}
/* composer 直接叠在 PDP 上(z-index 95 > PDP),不关闭 PDP ——
   这样用户唤起输入框后又不想问了,关掉仍停在商品页,而不是被弹回首页 */
function askMigooPDP(){ if (currentPdpId) openFocus(null, currentPdpId); }
function attachSheetDrag(ov){
  ['.sheet-grabber','.pdp-hero'].forEach(sel=>{
    const el = ov.querySelector(sel);
    if (el) el.addEventListener('pointerdown', sheetPointerDown);
  });
  const body = ov.querySelector('.pdp-body');
  if (body) body.addEventListener('scroll', ()=>{
    if (!ov.classList.contains('full') && body.scrollTop > 6) ov.classList.add('full');
  }, { passive:true });
}
function sheetPointerDown(e){
  if (e.target.closest('.pdp-close') || e.target.closest('.pdp-watch')) return;
  const ov = document.getElementById('pdp');
  const phone = ov.closest('.phone');
  sheetDrag = { y:e.clientY, halfTop:Math.round(phone.clientHeight*0.10), full:ov.classList.contains('full') };
  ov.classList.add('dragging');
  window.addEventListener('pointermove', sheetPointerMove);
  window.addEventListener('pointerup', sheetPointerUp);
}
function sheetPointerMove(e){
  if (!sheetDrag) return;
  const ov = document.getElementById('pdp');
  const dy = e.clientY - sheetDrag.y;
  const base = sheetDrag.full ? 0 : sheetDrag.halfTop;
  let top = Math.max(0, base + dy);
  if (top <= sheetDrag.halfTop){ ov.style.top = top+'px'; ov.style.transform = 'translateY(0)'; }
  else { ov.style.top = sheetDrag.halfTop+'px'; ov.style.transform = 'translateY('+(top-sheetDrag.halfTop)+'px)'; }
}
function sheetPointerUp(e){
  if (!sheetDrag) return;
  const ov = document.getElementById('pdp');
  const dy = e.clientY - sheetDrag.y;
  ov.classList.remove('dragging');
  ov.style.top = ''; ov.style.transform = '';
  if (!sheetDrag.full){
    if (dy < -40) ov.classList.add('full');
    else if (dy > 70) closePDP();
  } else { if (dy > 60) ov.classList.remove('full'); }
  sheetDrag = null;
  window.removeEventListener('pointermove', sheetPointerMove);
  window.removeEventListener('pointerup', sheetPointerUp);
}

/* 一个卡型走到底:眉题与事件行都是可选的。

  /* 动作区整体拦截冒泡:quiet 卡把它放进了 .bd,而 .bd 在带 openPDP 的 .lk-hd 里,
     不拦的话点 ⋯ 菜单里的任何一项都会连带把 PDP 打开。

  const acts = `<div class="lk-acts" onclick="event.stopPropagation()">${btns}

     定义归 Tasks tab,在这儿再写一遍是让人复习自己设过什么,而他是来看结果的。
     眉题带时间:同类产品(ChatGPT 的 chat、GitHub 的 run、Keepa 的邮件)全都有;
     没有"什么时候",用户判断不了该不该现在就动。 */
  return `<div class="lk-card lk-reveal${quiet ? ' quiet' : ''}">

/* ============================================================
   价格提醒 —— 它不是一个新对象,是收藏的一个属性
   ------------------------------------------------------------
   Migoo 收藏后本来就在盯价,并且会自己判断什么值得说(历史最低之类)。
   那用户为什么还要自己划一条线?只有一个理由:降噪 ——
   "我只有到 150 才买,别的时候别烦我。"
   所以这个功能的价值是让 Migoo 闭嘴,不是让它提醒。文案必须照这个写:
     ✅ I'll only ping you at $299        —— 只在那时候烦你
     ❌ I'll watch it for you             —— 收藏时已经说过,重复
   之前四轮文案改不好,是因为改的是"我会盯着",而盯着早就是默认的。

   设完之后只有三处变化,不新增任何可管理对象:
     1. 会话里复述一次(唯一一次显式确认)
     2. 卡上价格后面多一句灰色的 · Target $299(事实,与价格同类),
        按钮从 Set target price 换成 Adjust target(同一个位置换状态)
     3. 条件达成时这件东西升到 Updates 区,事件行说明是你自己划的线
   清除放在 ⋯ 菜单里 —— 卡面留常用的(改),菜单收不常用且带破坏性的(清)。
   它不进 autotask 列表 —— 到价了也只是告诉你,不动手。
   按上一版画的线,只有"到价直接帮我买"才配一个可撤销可审计的条目。 */
/* 预置两条:sneaker 是 Updates 区那张 TARGET HIT 卡的来路;
   tote 用来展示"已设但还没触发"长什么样(价格后挂标签,按钮位空出来)。 */
const ALERTS = { sneaker: 89, tote: 150 };
const alertLow = (pid) => Math.round(P[pid].pr * 0.91);
const alertLow2 = (pid) => Math.round(P[pid].pr * 0.85);
/* 已设的线跟在价格后面,不占按钮位 —— 它是这件东西的一个事实(和价格同类),
   不是一个动作,所以不做成可点的控件,只是一句灰色元数据。 */
/* WATCH 态下指令行已经写明"到 $150 叫我",价格后不必再挂一次 */
const priceTag = (pid, priceHTML) => priceHTML + ((!WATCH_MODE && ALERTS[pid] !== undefined)
  ? `<span class="lk-target">· Target $${ALERTS[pid]}</span>` : '');
/* 已设就不再出这个按钮 —— 位置让给别的动作,状态由价格后面那枚标签承担 */
/* 措辞统一到 target 一个词:眉题是 TARGET HIT、价格后是 · Target $150,
   按钮再叫 price alert 就是同一件事三个名字。
   而且 alert 这个词不准 —— Migoo 收藏后本来就会提醒(历史最低之类),
   用户在这里做的不是"打开提醒",是把提醒收窄到自己那条线上。
   target 既说清了那条线,又和已有的两处对上。 */
const alertBtn = (pid) => ALERTS[pid] !== undefined
  ? `<button class="lk-btn" onclick="event.stopPropagation();moveAlert('${pid}')">Adjust target</button>`
  : `<button class="lk-btn" onclick="event.stopPropagation();askAlert('${pid}')">Set target price</button>`;
/* 设线不问一轮 —— Migoo 手里有价格历史,直接提一条线,连同数字一起说出去。
   之前先问"你要盯多少"再给几个候选,得为此造一套气泡内快捷回答;
   那个组件产品里没有,而且这一问本来就不必:助理该先给建议,不该先出考题。
   要改就直接说另一个数,会话本身就是调整入口,不需要额外控件。 */
function askAlert(pid){
  const n = alertLow(pid);
  ALERTS[pid] = n; renderLikesBody();
  sheetId = pid; sendQ(`Tell me if it drops below $${n}`);
}
function moveAlert(pid){
  const n = alertLow2(pid);
  ALERTS[pid] = n; renderLikesBody();
  sheetId = pid; sendQ(`Make it $${n} instead`);
}
function offAlert(pid){
  delete ALERTS[pid]; renderLikesBody();
  lkToast('Target cleared — the auto-task stays on');
}
/* 全部收藏里的一张卡:无眉题、无事件行,其余与更新卡完全相同。
   第二个按钮是"给这件东西定一个我自己的条件" —— 默认的盯价由 Migoo 判断
   什么算值得说,这个按钮才是用户自己划线。它不弹表单,而是进会话把条件说清楚,
   条件是自然语言的("降到 150 或者出新色就叫我"),不是一个数字输入框。 */
function lkRow(pid){
  const p = P[pid];
  return lkCard(null, null, pid, priceTag(pid, `$${p.pr}`),
    WATCH_MODE ? ['run', LK_RUN[pid] || 'Checked 20 min ago · no change'] : null,
    `<button class="lk-btn pri" onclick="event.stopPropagation();toast('In-app checkout — Migoo fulfils &amp; attributes')">Buy now</button>
     ${alertBtn(pid)}`);
}
/* 副标题说"有几件值得看",不说"刚检查过" ——
   检查是 Migoo 的工序,用户不关心;有几件值得看才是这一页的结论,
   而且它和下面 Updates · 3 对得上,读者第一眼就知道往哪儿看。 */
/* mshop 这个 agent 的任务里,一部分没有宿主商品(按日历跑,产出是一份清单)。

function goTask(i){
  lkSetTab('tasks');
  requestAnimationFrame(() => {
    const body = document.getElementById('lkBody');
    const card = body && body.querySelectorAll('.at-card')[i];
    if (!card) return;
    const br = body.getBoundingClientRect(), cr = card.getBoundingClientRect();
    const top = body.scrollTop + (cr.top - br.top) - Math.max(0, (br.height - cr.height) / 2);
    body.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    /* 入场动画(lk-reveal)结束后再闪,否则两条动画叠在一起谁都看不清 */
    setTimeout(() => {
      card.classList.add('at-hit');

    }, 300);
  });

function clearHomeDot(){

function lkRunScan(){
  lkScanned = true;
  const sub = document.getElementById('lkSub'), st = document.getElementById('lkSubText');
  const prog = document.getElementById('lkProg'), bar = document.getElementById('lkBar');
  const body = document.getElementById('lkBody');

  lkScanT.push(setTimeout(()=>{ bar.style.width='100%'; },1150));

/* 菜单向下展开会压到下一张卡上,而卡片之间只按 DOM 顺序叠放 ——

   菜单自己的 z-index 没用:它被关在本卡的层叠上下文里。
   所以开菜单时把整张卡抬起来,关掉时放回去。 */
function lkCloseMenus(){

function lkMenu(btn,e){ e.stopPropagation(); const m=btn.parentElement.querySelector('.lk-menu'); const was=m.classList.contains('open'); lkCloseMenus(); if(!was){ m.classList.add('open'); m.closest('.lk-card')?.classList.add('menuup'); } }
function lkNavMenu(e){ e.stopPropagation(); const m=document.getElementById('lkNavMenu'); const was=m.classList.contains('open'); lkCloseMenus(); if(!was)m.classList.add('open'); }

let lkToastT;

  t.textContent=msg; t.classList.add('show');

/* 输入框 placeholder 轮播:每条演示一种"说法",不是演示品类。

   可写宽度只剩 199px(头像 40 + 间距 10 + 框内左右留白与右侧两个图标)。
   按最窄的那版定长度,四个方案共用一套文案;要加长得先量。 */
const PH_ROLL = [
  'Tell me what you need',
  'A gift for mom, under $50',
  'Same look, less money',
  'Will this fit a carry-on?',
];
const PH_H = 21, PH_MS = 2600;
let phIdx = 0, phTimer = null;
function phStart(){
  const el = document.getElementById('phroll');
  if (!el) return;
  clearInterval(phTimer);
  phIdx = 0; el.style.transition = 'none'; el.style.transform = 'translateY(0)';
  setTimeout(()=>{ el.style.transition = ''; }, 30);
  phTimer = setInterval(()=>{
    if (!document.getElementById('phroll')) { clearInterval(phTimer); return; }
    phIdx++;
    el.style.transform = `translateY(-${phIdx * PH_H}px)`;
    if (phIdx === PH_ROLL.length) {          /* 停在克隆的首条上,动画完成后无声跳回 */
      setTimeout(()=>{
        el.style.transition = 'none'; el.style.transform = 'translateY(0)'; phIdx = 0;
        setTimeout(()=>{ el.style.transition = ''; }, 30);
      }, 480);
    }
  }, PH_MS);
}

const CF_CHIPS = ['Packing for Tokyo?','Compare two picks','Is this a good price?','Gift ideas','Best budget pick','Find me a dupe'];

/* ============================================================
   USE_CAPS:chips 从"现成 query"升为"能力入口"(两层)
   ------------------------------------------------------------
   关掉 USE_CAPS 时 chips 是六条具体问句 —— 一条 chip 只说得清一件事,
   六个位子被六个偶然的例子占满,用户读到的是"这六件事我能问",
   而不是"你能让我做什么"。
   打开后这一排换成能力:第一层是能力(Outfit ideas / Compare / …),
   第二层才是该能力下的具体 query。好处:
     · 能力名稳定、可穷举,这一排就成了能力清单本身(skills 外露)
     · 具体 query 想换随时换,不占能力的位置
   标签用用户自己会说的话,不追求语法一致。曾经强推过"动词起头"这条格式规则,
   结果逼出 Get a verdict / Check a price 这种设计师英语 —— 形式整齐,
   但没人这么说话。判断标准只有一条:一个人站在货架前会不会这么问自己。
   Outfit ideas / Good price? 是会的,Get a verdict 不是。
   也别做成购物频道的分类(Comparison / Gifts / Reviews 那种名词读法)。

   选中后能力不写进输入框,而是作为一枚可摘的标签挂在输入框里 ——
   与商品引用(cf-quote)同一个附件范式:框里挂着什么,就在什么范围内问。
   标签自带 × 可摘,摘掉即退回能力这一层,所以不需要"再点一次取消"这种隐形操作。
   placeholder 随能力换,替代原来预填起手式的作用 —— 标签已经说了是对比,
   输入框再写一遍 "Compare " 是同一句话说两遍。

   排序按"要不要先有个商品在手":
     Outfit / Gift 从零就能点(还没看上任何东西时也用得上),放前面;
     Compare / Good price? 都预设你手里已经有候选,放后面。
   首屏没有上下文,灵感类在前。 */
const CAP_CHIPS = [
  /* 穿搭这一格是垂类,但仍然守得住这一排的规矩 ——
     它有要补的东西(什么场合),落点还是输入框。
     换掉的 Worth it? 问题不在垂不垂,在于它太抽象:

     那些没有要补的东西,点下去只能给一屏货,和这一排的落点不是一回事。 */

const CAP = Object.fromEntries(CAP_CHIPS.map(c => [c.k, c]));
/* 每个能力一枚 icon —— 这一排与"现成 query"那一排形状相同(都是圆角 pill),
