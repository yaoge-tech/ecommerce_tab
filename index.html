/* 引用了具体商品时换一组"对这件东西"的 query;尺码/试穿只对服饰类出 */
const CF_CHIPS_PROD = ['More like this','Find it cheaper','Is this a good price?'];
/* like 分家之后,PDP 上一个 auto-task 的痕迹都没有 —— 创建走 Ask 里这一枚。
   它就是一句半成品的话:点了把 "Remind me when " 键进输入框,用户自己说完。
   不再进"能力"那一层(蓝标签 + 一屏条件裸行)—— 形状是句子,行为就该是句子;

const CF_CHIP_REMIND = () => ({ t:'Remind me when…', act:`cfType('Remind me when ')` });
const CF_CHIPS_WEAR = ['What size should I get?'];
/* watch 态下,商品 composer 的 chips 换成四条"到什么时候告诉我" ——
   它们是句子不是选项,点了键入输入框,发出去就是一条任务。
   价格那条带上现价算出的具体数字:用户手上没有参照就写不出条件。 */
/* 当前条件的一句话说法 —— 标签里放得下的长度 */
const watchRule = (id) => ALERTS[id] ? `below $${ALERTS[id]}` : 'price or stock';
/* 铃铛的两态分工:要"说"才进会话,只是要"看"就别进。
     未设置 → 你要做一件还不存在的事,必须说出条件 → 进 composer
     已设置 → 你多半只是想确认它还在、当初设的是多少 → toast 报出来就够了。
   为一个"看一眼"的意图付一次盖住商品 + 拉键盘的代价,不划算;
   真要改,toast 上那一下才进 composer,那时用户是带着"我要改"进去的。
   铃铛在任何一态都不再直接关掉任务 —— 误触关掉一条盯了很久的价太贵。 */
function bellTap(id){
  if (!saved.has(id)) return goWatchChips(id);
  toast(`Auto-task on · ${watchRule(id)}`, { t:'Change', fn:`goWatchChips('${id}')` });
}
function stopWatch(id){
  saved.delete(id); delete ALERTS[id];
  closeFocus(); closeChat();
  const pill = document.getElementById('pdpSave');
  if (pill) { pill.innerHTML = IC.bell(false); pill.setAttribute('aria-label','Create auto-task'); }
  document.querySelectorAll('#h-'+id).forEach(h=>h.innerHTML = IC.bell(false));

const watchChips = (id) => [
  `Tell me if it drops below $${Math.round(P[id].pr*0.9)}`,
  `Tell me when it’s back in stock`,
  ...(P[id].tryon ? [`Tell me when my size is in`] : []),
  `Tell me if a new colour drops`,
];
const IC_X = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
let cfValue = '';
let cfProd = null;                                     /* 当前引用的商品 id */
let cfCap  = null;                                     /* 当前选中的能力 chip(仅 USE_CAPS 态) */
let cfWatch = false;                                   /* 这次唤起只列"到什么时候叫我" */
const cfEsc = s => s.replace(/'/g, "\\'");
function cfRender(){
  const t = document.getElementById('cfText');
  if (!t) return;
  t.className = 'cf-text' + (cfValue ? '' : ' ph');
  /* 聚焦即有光标:空态时光标在 placeholder 之前(iOS 原生行为) */
  t.innerHTML = cfValue
    ? `${cfValue}<span class="caret"></span>`
    : `<span class="caret lead"></span>${cfWatch ? (saved.has(cfProd) ? 'Change it, or tell me another' : 'When should I tell you?') : (cfProd ? 'Ask about this…' : (cfCap ? CAP[cfCap].ph : PH_ROLL[0]))}`;
  document.getElementById('cfSend').classList.toggle('off', !cfValue);
}
/* 通用 composer 与商品 ✦ 走同一个函数 —— 点 ✦ 本质就是"唤起输入框 + 引用这件商品 + 给几条 query" */
/* 三种形态,按"这份列表是穷举还是举例"分,不按文字长短分:
     方角 + icon 的 chip  = 能力。点了会进入一个状态。
     全圆 pill,无 icon    = 直接给的 query。举例 —— 关于这件商品你能问的事无穷,
                            这几条只是起个头,横滑本身就在说"还有,而且不重要"。
     裸行(竖排,行末 ↘)  = 某个能力下的 query。穷举 —— 这个能力就这几种说法,
                            读起来像一份清单,而清单要能退出,靠输入框里那枚标签的 ×。
   裸行只出现在能力选中态:它的形态承诺了"你正处在一个状态里",
   而直接推荐没有那个状态,套上这个形态就是许了一个兑现不了的承诺。 */
/* watchOnly:只列条件,不列别的能力。
   商品 composer 有两个入口,它们要的 chips 不是一回事:
     ✦ / Ask Migoo   → "关于这件东西我想问点什么"(找同款、比价、试穿)
     Tell me when… › → "到什么时候叫我"(只有条件)
   之前把 watch 态下所有商品 chips 一律换成条件,结果 ✦ 那个入口也被换掉,
   而 Try it on 又被无条件插在最前面,于是条件列表里混进一个执行型能力。 */
function openFocus(prefill, prodId, capKey, watchOnly){
  cfValue = prefill || '';
  cfProd  = prodId || null;
  cfCap   = capKey || null;
  cfWatch = !!watchOnly;
  const p = cfProd ? P[cfProd] : null;
  /* 能力型 chip(试穿)直接执行,query 型 chip 键入不发送 —— 视觉同构,措辞区分(动词 vs 问句) */
  const chips = !p ? CF_CHIPS.map(t=>({t}))
    : cfWatch ? watchChips(cfProd).map(t=>({t}))
    : ((p.tryon && !CHAT_DOCK) ? [{t:'Try it on', act:`openTryOn('${cfProd}')`}] : [])
        .concat(LIKE_SPLIT ? [CF_CHIP_REMIND()] : [], CF_CHIPS_PROD.map(t=>({t})), p.tryon ? CF_CHIPS_WEAR.map(t=>({t})) : []);
  /* USE_CAPS 且无商品引用时走两层。选中能力后这一排换成该能力的整句建议 ——
     能力已经以标签形式挂在输入框里,再留一排 chips 就是同一件事占两处。
     引用了具体商品时不换 —— 那时上下文已经收窄到这件东西,再摆一遍全局能力是噪音。 */
  /* watch 态本来就是一个能力:"到什么时候叫我"。以前它只表现为一组 chips,
     没有名字也没有可撤销的状态 —— 而它恰恰是全站最需要说清范围的那一个。
     升格成一枚 Auto-task 标签之后,它和 Gift ideas 走同一套:
     标签挂在输入框里、建议在上方、× 退回普通的商品 composer。 */
  /* 已经设过的话,标签自己把条件说出来 —— 用户回到这个 PDP,想知道的从来不是
     "有没有",而是"我当初设的是什么"。写进标签就不用再加一行说明。
     placeholder 随之从"设"变成"改";建议里补一条停掉,否则删除只能去任务页找。 */
  const watchOn = cfWatch && saved.has(cfProd);

    ? { k:'watch',

        qs: watchOn
          ? [...watchChips(cfProd), { t:'Stop this auto-task', act:`stopWatch('${cfProd}')` }]
          : watchChips(cfProd) }
    : ((USE_CAPS && !p && cfCap) ? CAP[cfCap] : null);
  const dockTop = cap
    ? `<div class="cf-sugs">${cap.qs.map(q=>{
         const t = q.t || q;   /* 条目可以是一句话(点了进框),也可以带 act(点了直接执行) */
         return `<div class="cf-sug${q.act?' act':''}" onclick="${q.act || `cfType('${cfEsc(t)}')`}">

    : (USE_CAPS && !p)
      ? `<div class="cf-chips">${CAP_CHIPS.map(c=>
           `<span class="cf-chip capchip" onclick="openCap('${c.k}')"><span class="ci">${CAP_IC[c.k]}</span>${c.t}</span>`).join('')}</div>`
      : `<div class="cf-chips">${chips.map(c=>
           `<span class="cf-chip${c.cap?' capchip':''}" onclick="${c.act || `cfType('${cfEsc(c.t)}')`}">${c.cap?`<span class="ci">${CAP_IC[c.cap]}</span>`:''}${c.t}</span>`).join('')}</div>`;
  /* ---- opt41:composer 就是会话浮层的 dock ----
     四个入口(输入框 / agent 头像 / 能力 chip / 商品 ✦)全部走到这里,
     区别只剩浮层开着时 dock 里装的是什么。能力选中时它升格成这一段的抬头,
     而不再是输入框里的一枚标签 —— 此刻它是整个 dock 的范围。 */
  if (CHAT_DOCK) {
    /* 引用条在能力标签之上 —— 读起来是"这件东西 → 要拿它做什么",
       反过来就成了"要做什么 → 哦对了是这件",宾语迟到。 */
    const inputHTML = `
      <div class="cf-input">
        ${p ? cfQuoteHTML(p) : ''}

          <span class="dx" onclick="cfDropCap()">${IC_X}</span></div>
        ${rows2HTML(cap.qs)}${inputHTML}</div>`, '');
    } else {
      openDockComposer(dockTop, inputHTML);

    return;
  }
  document.getElementById('cfocus').innerHTML = `
    <div class="cf-scrim" onclick="closeFocus()"></div>

function rows2HTML(list){

    `<span class="cf-chip" onclick="cfType('${cfEsc(q)}')">${q}</span>`).join('')}</div>`;

  if (cfWatch && ctx && !LIKE_SPLIT) {

   现在它只改高度:同一层、同一条线程、同一个关闭键,展开与收起互为反向。 */

/* ============================================================
   会话统一时序:query 先出 → 思考 2s → 逐段流式打出 → 富内容淡入
   所有"点击卡进会话"的入口都走 chatFlow,不再一次性 render 全部内容
   ============================================================ */
let flowT = [];
function flowStop(){ flowT.forEach(clearTimeout); flowT = []; }
function chatScrollEnd(){ const b = document.querySelector('#chat .cbody'); if (b) b.scrollTop = b.scrollHeight; }
/* 逐字打出 HTML。进度由 performance.now() 决定而非"每帧一个字":
   定时器被节流时按真实经过时间一次补齐,总时长恒定,不会卡在开头。
   标签不算可见字符,但截断位置始终落在完整标签之后,避免打到一半的属性被渲染。 */
const TYPE_CPS = 78;                                   /* 每秒字符数 */
function typeHTML(el, html, done){
  const cuts = [];                                     /* cuts[n-1] = 显示 n 个可见字符时的截断长度 */
  for (let i = 0; i < html.length; ) {
    const c = html[i];
    if (c === '<')      { const j = html.indexOf('>', i); i = j < 0 ? html.length : j + 1; }
    else if (c === '&') { const j = html.indexOf(';', i); i = (j > 0 && j - i < 8) ? j + 1 : i + 1; cuts.push(i); }
    else                { i++; cuts.push(i); }
  }
  const total = cuts.length;
  if (!total) { el.innerHTML = html; done && done(); return; }
  const t0 = performance.now();
  const step = () => {
    const n = Math.min(total, Math.floor((performance.now() - t0) / 1000 * TYPE_CPS));
    if (n >= total) { el.innerHTML = html; chatScrollEnd(); done && done(); return; }
    el.innerHTML = html.slice(0, n ? cuts[n-1] : 0) + '<span class="tcur"></span>';
    chatScrollEnd();
    flowT.push(setTimeout(step, 16));
  };
  step();
}
/* pre = 直接呈现的上文(历史消息/时间戳);segs = [{t:文字, rich:富内容}] */
function chatFlow(pre, userHTML, segs){
  flowStop();
  chatShell((pre || '') + (userHTML || '') +
    `<div class="ma" id="ctyping"><div class="b tping"><i></i><i></i><i></i></div></div>`);
  chatScrollEnd();
  const body = document.querySelector('#chat .cbody');
  const runSeg = (i) => {
    if (i >= segs.length) { document.getElementById('ctyping')?.remove(); return; }
    const s = segs[i];
    const el = document.createElement('div');
    el.className = 'ma';
    /* seg.tag 挂在气泡顶部且不参与打字 —— 见 .btag 注释 */
    el.innerHTML = '<div class="b">' +
      (s.tag ? `<div class="btag">${IC.bellSm}<span>${s.tag}</span></div>` : '') +
      '<span class="bt"></span></div>';
    body.insertBefore(el, document.getElementById('ctyping'));
    typeHTML(el.querySelector('.bt'), s.t, () => {
      if (s.rich) {
        const r = document.createElement('div');
        r.className = 'crich';
        r.innerHTML = s.rich;
        el.querySelector('.b').appendChild(r);
        chatScrollEnd();
      }
      if (i + 1 < segs.length) flowT.push(setTimeout(()=>runSeg(i+1), 620));
      else document.getElementById('ctyping')?.remove();
    });
  };
  flowT.push(setTimeout(()=>{
    document.getElementById('ctyping')?.remove();
    runSeg(0);
  }, 2000));
}

function replyFor(q, id) {
  const low = q.toLowerCase();
  /* 无商品上下文(首页 composer 发出) */
  if (!id) {
    if (low.includes('pack') || low.includes('tokyo'))
      return { text: `October in Tokyo runs 12–20°C — layers, not a coat. You already saved the tote, so for the flight I'd add a personal-item bag and something that keeps tea hot on train days:`, ids: ['backpack','bottle'] };
    if (low.includes('compare'))
      return { text: `Point me at any two and I'll line up the specs. The pair you were stuck on yesterday:`, ids: ['keenz','doona'] };
    if (low.includes('good price') || low.includes('price'))
      return { text: `Two of your saves moved this week — both are at their lowest since you saved them:`, ids: ['phones','sneaker'] };
    if (low.includes('gift'))
      return { text: `Your mom's birthday is May 4, and you said she wears classic scents. These two are safe without being boring:`, ids: ['perfume','candle'] };
    if (low.includes('budget'))
      return { text: `Under $40 and genuinely worth owning — I'd buy both of these myself:`, ids: ['bottle','mug'] };
    if (low.includes('dupe'))
      return { text: `Tell me which one to match. From what you've saved, these two have the closest honest alternatives:`, ids: ['sunglasses','tote'] };
    return { text: `On it. From what you've told me before, here's where I'd start:`, ids: ['backpack','bottle'] };
  }
  /* 有商品上下文(✦ 浮层发出) */
  const p = P[id];
  /* 价格提醒:先给参照(现价 + 收藏以来的最低),再问要盯哪条线。
     不问"你要设多少"就直接给输入框 —— 用户没有参照就填不出数,
     这也是上一版数字键盘方案真正卡住的地方。 */
  /* 四条条件句 → 一条任务。回复只做两件事:复述成可执行的一句,补上默认值。
     不反问 —— 每多问一个问题就重一分,这是"轻量创建"能不能成立的地方。 */
  if (low.includes('back in stock'))
    return { tag:'Auto-task updated', text: `Done — I’ll ping you the moment the ${p.nm} is back. I check a few times a day, and I’ll only say it once.`, ids: [] };
  if (low.includes('my size'))
    return { tag:'Auto-task updated', text: `Done — watching US 9 on this one. If it comes back in another size first I’ll stay quiet.`, ids: [] };
  if (low.includes('new colour') || low.includes('new color'))
    return { tag:'Auto-task updated', text: `Done — I’ll tell you if a new colourway shows up. Right now it’s ${(PDPD[id]?.variants?.[0]?.options||[]).length || 4} colours.`, ids: [] };
  if (low.includes('drops below'))
    return { tag:'Auto-task updated', text: `Done — I’ll only ping you at <code>$${ALERTS[id]}</code>. It’s <code>$${p.pr}</code> today and the lowest I’ve seen since you saved it is <code>$${alertLow(id)}</code>, so that line is realistic. Tell me another number any time.`, ids: [] };
  if (low.includes('instead'))
    return { tag:'Auto-task updated', text: `Moved — <code>$${ALERTS[id]}</code> it is. That’s below anything I’ve seen this year, so it may sit a while. I’ll stay quiet until then.`, ids: [] };
  if (low.includes('more like'))
    return { text: `In the same lane as the ${p.nm} — two worth a look:`, ids: SIMILAR[id] };
  if (low.includes('cheaper') || low.includes('lower') || low.includes('price'))
    return { text: `Best I can see right now: <code>$${Math.round(p.pr*0.9)}</code> at Walmart, same colorway, in stock. I can watch it and ping you under <code>$${Math.round(p.pr*0.8)}</code>.`, ids: [] };
  return { text: `On it — from what you told me before, here's my read on “${q}” for the ${p.nm}:`, ids: SIMILAR[id].slice(0,2) };
}
function sendQ(q) {
  const id = sheetId;
  closeSheet();
  /* 浮层模式下不关 PDP —— 会话是叠在当前页上的一层,当前页可以是 PDP。
     整页模式仍要关:那是真的换了地方,PDP 留在底下没有意义。 */
  if (!CHAT_SHEET) closePDP();
  const r = replyFor(q, id);
  chatFlow(chatPre(), bubbleU(q, id), [{ t: r.text, rich: plist(r.ids), tag: r.tag }]);
  if (CHAT_SHEET) markCopilot();
}
/* 常驻入口:只有浮层模式才有意义 —— 它是"回到那条对话"的门。
   整页模式下这条对话本来就住在 tab1,不需要第二个入口。 */
let askVisible = true, askObs;
function markCopilot(){
  const el = document.getElementById('copilot'), bot = document.getElementById('askbot');
  const mark = `<img src="${A}${CHAT_AGENT ? 'mshop-logo.png' : 'migoo-logo.png'}">`;
  if (bot) bot.innerHTML = mark;
  if (!el) return;
  /* 与贴在输入框里的那枚共用同一份内容 —— 同一个对象,只是换了位置 */
  el.className = 'copilot' + (CHAT_AGENT ? '' : ' migoo') + (el.classList.contains('show') ? ' show' : '');
  el.innerHTML = mark;
  /* 浮起来的条件只有一个:贴着输入框的那个已经看不见了。
     两个入口同时在场就是重复,同时不在场就没了回到对话的路。 */
  const chatOpen = document.getElementById('chat')?.classList.contains('show');
  el.classList.toggle('show', CHAT_SHEET && !askVisible && !chatOpen);
}
function watchAskDock(){
  askObs?.disconnect();
  const row = document.querySelector('.askrow'), root = document.getElementById('sb');
  askVisible = true;
  if (!row || !root) { markCopilot(); return; }
  askObs = new IntersectionObserver(es => {
    askVisible = es[0].isIntersecting;
    markCopilot();
  }, { root, threshold: 0.55 });
  askObs.observe(row);
}
/* dock 版里头像和输入框落到同一个默认态 —— 它们本来就通向同一条线程,
   只是一个说"回去",一个说"说点什么";进去之后没有理由长得不一样。 */
function openCopilot(){
  if (CHAT_DOCK) { sheetId = null; openFocus(''); return; }
  sheetId = null;
  chatShell(chatPre());
  chatScrollEnd();
}
function openChatFree() { sheetId = 'backpack'; sendQ('What should I pack for Tokyo in October?'); }
/* ============================================================
   query 卡 → 会话:一个入口吃下所有 query 卡。
   点击 = 把这条 query 连同 attachment 原样发出去,不按卡型分支。
   attachment 是商品就发商品(会话里可点进 PDP),是参考图就发图。
   回答挂在 QCARDS[key].reply 上,延迟求值以便用到后面定义的 plist/pbig。
   ============================================================ */
QCARDS.stroller.reply = () => [
  { t: `You're flying in October, so fold size decides it — the Keenz folds to cabin size at 13.6 lb, the Doona doesn't fold small at all.`,
    rich: plist(['keenz','doona']) },
  { t: `If the flight is the hard part, I'd take the Keenz:`, rich: pbig('keenz') }
];
QCARDS.flight.reply = () => [
  { t: `Short version: <b>Keenz for the Tokyo flight, Doona if the car is daily life.</b>`,
    rich: `<table class="ctb">
          <tr><td class="k"></td><td><b>Keenz Air Plus</b></td><td><b>Doona</b></td></tr>
          <tr class="bf"><td class="k">Best for</td><td><span class="bft">Flying</span></td><td><span class="bft">Car days</span></td></tr>
          <tr><td class="k">Price</td><td><span class="w">$349</span></td><td>$549</td></tr>
          <tr><td class="k">Weight</td><td><span class="w">13.6 lb</span></td><td>17.2 lb</td></tr>
          <tr><td class="k">Fold</td><td><span class="w">Cabin size</span></td><td>Doesn't fold</td></tr>
          <tr><td class="k">Car seat</td><td>Separate</td><td><span class="w">Built-in</span></td></tr>
        </table>` + plist(['keenz','doona']) }
];
QCARDS.chairs.reply = () => [
  { t: `Went back out for you. Two more under $150 that fit a 32" table — both new since you looked:`,
    rich: plist(['chair4','chair5']) },
  { t: `Say the word and I'll narrow it by seat depth or how it handles a hard floor.` }
];
QCARDS.hat.reply = () => [
  { t: `The cap reads <b>STILL HERE NY</b> — that label sells out fast, so here's the closest in stock plus the sunglasses she's got on:`,
    rich: plist(['hat','sunglasses']) },
  { t: `The tee is a vintage band shirt, so there's no exact match. Want me to hunt for a similar print?` }
];

function askQ(key) {
  const c = QCARDS[key];
  if (CHAT_SHEET) setTimeout(markCopilot, 0);
  chatFlow(chatPre(), bubbleU(c.q, c.pk || c.ids, c.img), c.reply ? c.reply() : [
    { t: `On it — give me a second.` }
  ]);
}
function closeChat() {
  flowStop();
  /* 浮层关掉不等于对话没了 —— 存回线程,常驻入口再点开就接着看。
     这是把会话改成浮层的前提:不存,浮层比切 tab 更糟(切 tab 至少留在 tab1)。 */
  const body = document.querySelector('#chat .cbody');
  if (CHAT_SHEET && body) cthread = [body.innerHTML.replace(/<div class="ma" id="ctyping">[\s\S]*?<\/div><\/div>/,'')];
  document.getElementById('chat').classList.remove('show');
  document.getElementById('chatScrim')?.classList.remove('show');
  /* 展开是"这一次我要多看几行",不是一项偏好 —— 关掉就复位 */
  chatTall = false;
  document.getElementById('chat').classList.remove('tall', 'kbdup');
  if (CHAT_DOCK) kbdShow(false);
  if (CHAT_SHEET) markCopilot();
}
/* 从 Shop 点 Migoo tab → 切到助理 tab(会话的常驻家) */
function openAssistant() {
  chatShell(
    `<div class="cts">Today</div>` +
    bubbleA(`Morning. Two of your saves moved overnight — the AirPods Max hit its lowest since you saved it, and the Nike Free is at your $89 target.` + plist(['phones','sneaker']))
  );
}

/* ---------- 策展流页(橱窗卡/运营卡落地) ---------- */
const FLOWS = {
  desk:  { t:'Late-night desk reset', s:'From your chat — you said late-night work runs', ids:['lamp','keyboard','chair','candle','mug','plant'], refine:'Tell me to swap anything ›' },
  deals: { t:'Deals worth a look', s:'This week · free shipping over $35', ids:['speaker','mug','bottle','candle'], refine:'' },
};
function openFlow(key) {
  const f = FLOWS[key];
  const c1=[], c2=[];
  f.ids.forEach((id,i)=>(i%2===0?c1:c2).push(gcard(id)));
  document.getElementById('flow').innerHTML = `
    <div class="fhead"><span class="fback" onclick="closeFlow()">${IC.back}</span>
      <div><div class="ft">${f.t}</div><div class="fs">${f.s}</div></div></div>
    <div class="fbody">
      <div class="grid" style="padding:0"><div class="gcol">${c1.join('')}</div><div class="gcol">${c2.join('')}</div></div>
      ${f.refine ? `<div class="frefine" onclick="toast('Refine — 一句话调整这条流(P1 接会话)')">${f.refine}</div>` : ''}
    </div>`;
  document.getElementById('flow').classList.add('show');
}
function closeFlow() { document.getElementById('flow').classList.remove('show'); }

/* ---------- 生成预览浮层(生成预览卡落地) ---------- */
function openGenSheet() {
  document.getElementById('sheet').innerHTML = `
    <img src="${A}prod-lamp.jpg" style="width:100%;aspect-ratio:1/0.72;object-fit:cover;border-radius:16px;display:block">
    <div style="margin-top:12px">
      <div style="font-family:var(--serif);font-size:17px;font-weight:600;color:var(--black)">The Lumen, on your desk</div>
      <div style="font-size:12.5px;color:var(--text-65);margin-top:3px">Preview only — the product photo is untouched</div>
    </div>
    <div class="pills">
      <button class="spill" onclick="closeSheet();openPDP('lamp')">VIEW PRODUCT</button>
      <button class="spill" onclick="toast('Saved to your project — 接创作管线(P1)')">PUT IN MY CREATION</button>
    </div>`;
  document.getElementById('scrim').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

/* ---------- shared ---------- */
function toggleSave(id) {
  const on = !saved.has(id);
  if (on) saved.add(id); else saved.delete(id);
  const pdpOpen = document.getElementById('pdp')?.classList.contains('open');
  if (pdpOpen) {
    const pill = document.getElementById('pdpSave');
    if (pill) { pill.innerHTML = WATCH_MODE ? IC.bell(on) : IC.heart(on); pill.setAttribute('aria-label', WATCH_MODE ? (on?'Auto-task on':'Create auto-task') : (on?'Saved':'Save')); }
    document.querySelectorAll('#h-'+id).forEach(h=>h.innerHTML = WATCH_MODE ? IC.bell(on) : IC.heart(on));
  } else {
    render();
  }
  /* toast 必须在 render 之后 —— render() 会重建整个 phone(含 #toast 节点),
     先弹就会被当场抹掉。这条从流里点收藏时一直没显示过,只是以前没人点得着;
     现在 toast 带入口,入口还没来得及点就没了,才暴露出来。
     文案:收藏是"这个我在意",盯价是它自带的结果 —— 只在这里说一次,之后不再提。
     带一个去 Likes 的入口:承诺说完就该有地方看见它。 */
  /* 一下点击创建的就是一条最轻的 auto-task,没有任何条件要填。
     用 auto-task 这一个名词说到底 —— 会话里的眉题已经是 Auto-task updated,
     这里再叫 Watching 就是两个名词抢同一个概念,用户得自己猜它们是不是一回事。
     toast 的动作不是"去看收藏夹",而是"再收窄一点":承诺说完,
     紧接着给唯一一个值得追加的动作,而不是把人送去一个列表。 */
  /* like 分家之后,收藏就只是收藏 —— 不再顺带承诺"我会替你盯价"。
     那句承诺属于 auto-task,混进来会让用户以为收藏本身就会跑。 */
  if (LIKE_SPLIT) {
    /* 收了东西就该给个看得见的去处 —— 但只给这一个,不带任何 agent 的动作。 */
    if (on) toast('Added to Likes', { t:'View like list', fn:'openLikeList()' });
    else toast('Removed from Likes');
  }
  else if (WATCH_MODE) {
    if (on) toast('Auto-task created · I’ll tell you if the price or stock moves',
                  {t:'Add a condition', fn:`goWatchChips('${id}')`});
    else toast('Auto-task removed');
  }
  else if (on) toast('Saved, I’ll watch price and stock for you', {t:'View Likes', fn:'goLikes()'});
  else toast('Removed from Likes');
}
let toastTimer;
/* act = {t:文案, fn:点击执行的表达式}。带动作时停留久一点 ——
   一条能点的 toast 如果按普通时长消失,等于给了个够不着的入口。 */
function toast(msg, act) {
  const t = document.getElementById('toast');
  t.innerHTML = (act ? `<span class="tmsg">${msg}</span>` : msg) +
    (act ? `<span class="tact" onclick="hideToast();${act.fn}">${act.t}</span>` : '');
  t.classList.toggle('has-act', !!act);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), act ? 4200 : 1900);
}
function hideToast(){ clearTimeout(toastTimer); document.getElementById('toast')?.classList.remove('show'); }
/* 量完再决定要不要滚动装饰 —— chips 内容随方案变(4 枚能力 / 6 条 query),
   放不放得下不能写死在 CSS 里。 */
function markScrollable(){
  const r = document.querySelector('.askchips');
  if (!r) return;
  r.classList.remove('scrollable');
  const cs = r.querySelectorAll('.achip');
  if (!cs.length) return;
  /* 判据是"最后一枚有没有被切到",不是 scrollWidth —— 容器的右 padding 也算进
     scrollWidth,四枚能力 chip 因此虚报 6px 溢出,据此加渐隐就会把一枚
     完整可见的 chip 淡掉半截(看起来像渲染坏了)。 */
  const last = cs[cs.length - 1].getBoundingClientRect();
  if (last.right > r.getBoundingClientRect().right + 0.5) r.classList.add('scrollable');
}
function render() {
  document.getElementById('phone').innerHTML = statusbar() + home() + fbar() +
    `<div class="scrim" id="scrim" onclick="closeSheet()"></div>
     <div class="sheet" id="sheet"></div>
     <div class="flow" id="flow"></div>
     ${likesTab()}
     ${likeList()}
     <div class="pdp-backdrop" id="pdpBackdrop" onclick="closePDP()"></div>
     <div class="pdp-overlay" id="pdp"></div>
     <div class="chat-scrim" id="chatScrim" onclick="closeChat()"></div>
     <div class="copilot" id="copilot" onclick="openCopilot()"></div>
     <div class="chat" id="chat"></div>
     <div class="cfocus" id="cfocus"></div>
     <div class="kbd" id="kbd">${kbdHTML()}</div>
     <div class="toast" id="toast"></div>`;
  phStart();
  markScrollable();
  watchAskDock();
}
render();
</script>
